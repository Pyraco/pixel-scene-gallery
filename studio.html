<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Studio</title>
<meta name="description" content="Build painterly pixel-art landscapes: pick the time of day, season, terrain, water, trees and plants, then export PNG or video.">
<style>
:root {
  --bg: #0f1117; --panel: #161a23; --panel2: #1c212c; --line: #2a3140; --text: #e7ebf3; --muted: #8e98ab; --accent: #7cc36b; --accent2: #5aa0e6;
  --chip: #232a37; --chipOn: #2f4a2b; --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: flex; overflow: hidden; }
#panel { width: 312px; flex: none; height: 100%; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 14px 14px 24px; }
#panel::-webkit-scrollbar { width: 8px; } #panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; }
.brand .logo { width: 28px; height: 28px; image-rendering: pixelated; border-radius: 6px; }
.brand h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
.brand p { margin: 0; color: var(--muted); font-size: 11.5px; }
.sec { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 11px 11px; margin-bottom: 10px; }
.sec h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.row { margin: 8px 0 0; }
.row:first-of-type { margin-top: 0; }
.row > label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
.row > label b { color: var(--text); font-weight: 500; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, .btn { appearance: none; border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 12px; cursor: pointer; }
.seg button:hover, .btn:hover { border-color: #3d4759; }
.seg button.on { background: var(--chipOn); border-color: var(--accent); color: #fff; }
.seg button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
select, input[type=number] { width: 100%; background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: inherit; }
.inline { display: flex; gap: 6px; align-items: center; }
.inline input[type=number] { flex: 1; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 3px 0; color: var(--text); cursor: pointer; }
.toggle input { width: 34px; height: 18px; appearance: none; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; position: relative; cursor: pointer; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.toggle input:checked { background: var(--chipOn); border-color: var(--accent); }
.toggle input:checked::after { left: 18px; background: #fff; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.presets button { position: relative; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; aspect-ratio: 16 / 9; color: #fff; }
.presets button canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.presets button span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; padding: 10px 6px 4px; background: linear-gradient(transparent, rgba(0,0,0,.7)); text-align: left; }
.presets button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
#bar .title { font-weight: 600; margin-right: auto; display: flex; align-items: center; gap: 8px; }
#bar .title small { color: var(--muted); font-weight: 400; }
.btn.primary { background: #2b4a27; border-color: var(--accent); }
#stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0b0d12; }
#view { image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #000; }
#busy { position: absolute; top: 14px; right: 14px; background: rgba(15,17,23,.85); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 12px; color: var(--muted); opacity: 0; transition: opacity .15s; pointer-events: none; }
#busy.on { opacity: 1; }
#toast { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(20,24,32,.95); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
body.clean #panel, body.clean #bar { display: none; }
body.clean #stage { background: #000; }
@media (max-width: 760px) {                                  /* phones: the picture stays pinned at the top while the settings scroll under it */
  html, body { height: auto; }
  body { display: flex; flex-direction: column; overflow: visible; }
  #main { order: -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex: none; display: block; background: var(--bg); border-bottom: 1px solid var(--line); }
  #bar { flex-wrap: nowrap; overflow-x: auto; padding: 8px 12px; -webkit-overflow-scrolling: touch; }
  #bar .title { display: none; }
  #bar .btn { flex: none; }
  #stage { aspect-ratio: 16 / 9; width: 100%; height: auto; }
  #panel { width: 100%; height: auto; overflow: visible; border-right: 0; }
}
/* v2 panel: numbered sections, plain-English hints, low / high labels, scene types, the describe box */
.sec h2 { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); }
.sec h2 .num { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--chipOn); border: 1px solid var(--accent); color: #fff; font-size: 11px; }
.secsub { margin: -2px 0 8px; color: var(--muted); font-size: 11.5px; }
.row { margin-top: 12px; }
.hint { margin: -1px 0 6px; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.lohi { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 10.5px; margin-top: 2px; }
.lohi span:last-child { text-align: right; }
textarea { width: 100%; resize: vertical; background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; font: inherit; font-size: 12.5px; }
.heard { margin: 6px 0 0; font-size: 11.5px; color: var(--accent); min-height: 1em; }
.inline { margin-top: 6px; }
.types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.types button, .presets button { position: relative; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; aspect-ratio: 16 / 9; color: #fff; }
.types button canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.types button span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11.5px; font-weight: 600; padding: 12px 6px 4px; background: linear-gradient(transparent, rgba(0,0,0,.75)); text-align: left; }
.types button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
/* embedded players (clean): the scene fills the frame at every width */
body.clean { display: flex; flex-direction: row; overflow: hidden; height: 100vh; }
body.clean #main { position: static; height: 100vh; flex: 1; border: 0; }
body.clean #stage { aspect-ratio: auto; height: 100%; }

/* the HD finish: a smooth copy of the frame over the crisp one, and a soft glow over both */
#screen { position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #000; }
#screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#view { box-shadow: none; }
#viewSmooth { image-rendering: auto; }
#viewGlow { image-rendering: auto; filter: blur(6px) saturate(1.2); mix-blend-mode: screen; pointer-events: none; }
#screen canvas[hidden] { display: none; }

</style>
</head>
<body>
<aside id="panel" aria-label="Scene settings">
  <div class="brand">
    <canvas class="logo" id="logo" width="16" height="16" aria-hidden="true"></canvas>
    <div><h1>Pixel Studio</h1><p>Painterly pixel landscapes</p></div>
  </div>
  <div id="controls"></div>
</aside>
<main id="main">
  <div id="bar">
    <div class="title"><span id="sceneName">Summer Valley</span><small id="sceneInfo"></small></div>
    <button class="btn" id="play" title="Play / pause (Space)">Pause</button>
    <button class="btn" id="new" title="New variation (R)">New variation</button>
    <button class="btn" id="surprise" title="Random settings (S)">Surprise me</button>
    <button class="btn primary" id="png" title="Export a 1080p PNG (E)">PNG 1080p</button>
    <button class="btn" id="png4k" title="Export a 4K PNG">PNG 4K</button>
    <button class="btn" id="rec" title="Record 10 seconds of the animation">Record 10 s</button>
    <button class="btn" id="link" title="Copy a link to this exact scene">Copy link</button>
  </div>
  <div id="stage">
    <div id="screen"><canvas id="view" width="480" height="270" aria-label="Rendered scene"></canvas><canvas id="viewSmooth" width="480" height="270" aria-hidden="true" hidden></canvas><canvas id="viewGlow" width="480" height="270" aria-hidden="true" hidden></canvas><canvas id="viewFilm" width="960" height="540" aria-hidden="true" hidden></canvas></div>
    <div id="busy">Painting the scene&hellip;</div>
    <div id="toast" role="status"></div>
  </div>
</main>
<script id="core">
// ==========================================================================
// PIXEL STUDIO - painterly "HD pixel" landscapes. Every scene is built from settings (time of day, season, terrain,
// water, trees, plants...) and painted at a pixel-grid resolution with rich hue-shifted colour ramps: clustered light
// and shade instead of dithering, smooth skies, atmospheric depth. This file: randomness, noise, colour.
// The core is DOM-free so it runs in the browser app and in node (tools/render.js).
// ==========================================================================

// ---------- seeded randomness ----------
function makeRng(seed) {
  let a = seed >>> 0;
  const r = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + (hi - lo) * r();
  r.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * r());
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() < p;
  return r;
}
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function hash1(x, s) { return hash2(x, 0x5bd1e995, s); }

// ---------- noise ----------
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, oct) {
  let a = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < (oct || 4); i++) { a += amp * vnoise(x * f, y * f, s + i * 101); n += amp; amp *= 0.5; f *= 2.03; }
  return a / n;
}
function noise1(x, s) { return vnoise(x, 0.37, s); }
function fbm1(x, s, oct) { return fbm(x, 0.37, s, oct); }
function ridged1(x, s, oct) {                                   // sharp crests for mountain ridgelines
  let a = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < (oct || 5); i++) { const v = 1 - Math.abs(vnoise(x * f, 0.37, s + i * 57) * 2 - 1); a += amp * v * v; n += amp; amp *= 0.5; f *= 2.1; }
  return a / n;
}

// ---------- maths ----------
const TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(a, b, v) { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); }

// ---------- colour: sRGB floats [r,g,b] 0..1, OKLab for perceptual work ----------
function hex(h) { const n = parseInt(h.replace('#', ''), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
function toLin(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function toSrgb(c) { c = c < 0 ? 0 : c; return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }
function lin(c) { return [toLin(c[0]), toLin(c[1]), toLin(c[2])]; }
function srgb(c) { return [clamp01(toSrgb(c[0])), clamp01(toSrgb(c[1])), clamp01(toSrgb(c[2]))]; }
function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function mulc(a, b) { return [a[0] * b[0], a[1] * b[1], a[2] * b[2]]; }
function scalec(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
function addc(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function luma(c) { return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function oklab(c) {                                              // sRGB -> OKLab
  const r = toLin(c[0]), g = toLin(c[1]), b = toLin(c[2]);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
}
function fromOklab(o) {                                          // OKLab -> sRGB (clamped)
  const l = Math.pow(o[0] + 0.3963377774 * o[1] + 0.2158037573 * o[2], 3);
  const m = Math.pow(o[0] - 0.1055613458 * o[1] - 0.0638541728 * o[2], 3);
  const s = Math.pow(o[0] - 0.0894841775 * o[1] - 1.2914855480 * o[2], 3);
  return srgb([4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s]);
}
function saturate(c, k) { const o = oklab(c); return fromOklab([o[0], o[1] * k, o[2] * k]); }
function mixOk(a, b, t) { const p = oklab(a), q = oklab(b); return fromOklab([lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)]); }

// ---------- light rigs (time of day) ----------
// sun / amb are linear light colours: a surface of albedo A lit with diffuse d (0..1) shows A * (amb + sun * d).
// Shadows lean toward shadowAB (OKLab a,b) and highlights toward lightAB, the painter's hue shift.
const RIGS = {
  sunrise: {
    skyTop: '#4a5aa6', skyMid: '#d897b0', skyHorizon: '#ffcf9c', sunCol: '#fff0c0', sunX: 0.3, sunY: 0.47, sunR: 9, sunGlow: 0.95,
    sun: [1.32, 0.92, 0.7], amb: [0.26, 0.25, 0.42], shadowAB: [0.035, -0.08], lightAB: [0.05, 0.07], shadowShift: 0.48, lightShift: 0.32,
    haze: '#e4bcc4', hazeK: 1.05, sat: 0.26, elev: 0.08, cloudLit: '#ffd8c4', cloudShade: '#8a78a8', night: false, stars: 0.1
  },
  morning: {
    skyTop: '#5d8fd6', skyMid: '#93b9e6', skyHorizon: '#f3d7c4', sunCol: '#fff1d6', sunX: 0.22, sunY: 0.36, sunR: 7, sunGlow: 0.55,
    sun: [1.18, 1.02, 0.86], amb: [0.30, 0.34, 0.48], shadowAB: [0.010, -0.075], lightAB: [0.020, 0.070], shadowShift: 0.40, lightShift: 0.22,
    haze: '#c9d3e6', hazeK: 1.0, sat: 0.20, elev: 0.28, cloudLit: '#fff6ea', cloudShade: '#98a6c8', night: false, stars: 0
  },
  noon: {
    skyTop: '#2f78d8', skyMid: '#5b9ce6', skyHorizon: '#b7dcf5', sunCol: '#fffbe8', sunX: 0.26, sunY: -0.35, sunR: 8, sunGlow: 0.25,
    sun: [1.24, 1.20, 1.08], amb: [0.28, 0.36, 0.52], shadowAB: [-0.012, -0.070], lightAB: [0.000, 0.060], shadowShift: 0.40, lightShift: 0.18,
    haze: '#a9cdee', hazeK: 1.0, sat: 0.26, elev: 0.75, cloudLit: '#fffdf4', cloudShade: '#9db8dc', night: false, stars: 0
  },
  golden: {
    skyTop: '#4a6fbd', skyMid: '#8ea7d6', skyHorizon: '#ffd79e', sunCol: '#fff0b8', sunX: 0.24, sunY: 0.40, sunR: 8, sunGlow: 0.8,
    sun: [1.40, 1.02, 0.58], amb: [0.26, 0.28, 0.44], shadowAB: [0.020, -0.080], lightAB: [0.035, 0.100], shadowShift: 0.45, lightShift: 0.30,
    haze: '#e8c7a8', hazeK: 1.05, sat: 0.28, elev: 0.18, cloudLit: '#fff0c8', cloudShade: '#a38fb0', night: false, stars: 0
  },
  sunset: {
    skyTop: '#2c3478', skyMid: '#b35f86', skyHorizon: '#ffae5c', sunCol: '#fff0a0', sunX: 0.30, sunY: 0.49, sunR: 10, sunGlow: 1.0,
    sun: [1.30, 0.70, 0.36], amb: [0.22, 0.18, 0.34], shadowAB: [0.045, -0.085], lightAB: [0.060, 0.090], shadowShift: 0.50, lightShift: 0.35,
    haze: '#d7869a', hazeK: 1.1, sat: 0.30, elev: 0.06, cloudLit: '#ffd08a', cloudShade: '#7a4f86', night: false, stars: 0.15
  },
  dusk: {
    skyTop: '#16204a', skyMid: '#3e4a8a', skyHorizon: '#b68aa6', sunCol: '#ffc8a0', sunX: 0.3, sunY: 0.62, sunR: 0, sunGlow: 0.35,
    sun: [0.42, 0.36, 0.46], amb: [0.14, 0.15, 0.28], shadowAB: [0.020, -0.090], lightAB: [0.030, 0.010], shadowShift: 0.55, lightShift: 0.15,
    haze: '#5f5f96', hazeK: 1.0, sat: 0.18, elev: 0.1, cloudLit: '#c69ab4', cloudShade: '#454a80', night: true, stars: 0.6
  },
  night: {
    skyTop: '#070b1e', skyMid: '#12204a', skyHorizon: '#2e4378', sunCol: '#f2f0dc', sunX: 0.72, sunY: 0.16, sunR: 6, sunGlow: 0.45,
    sun: [0.19, 0.23, 0.38], amb: [0.06, 0.08, 0.17], shadowAB: [-0.010, -0.085], lightAB: [-0.025, -0.055], shadowShift: 0.6, lightShift: 0.4,
    haze: '#253866', hazeK: 1.0, sat: 0.12, elev: 0.5, cloudLit: '#7d8db8', cloudShade: '#1f2a52', night: true, stars: 1, moon: true
  }
};

// ---------- seasons: base colours (albedo) of the materials ----------
const SEASONS = {
  spring: { grass: '#6eae3c', grass2: '#8cbd45', leaf: ['#6cb444', '#7cc050', '#62a83e'], blossom: '#f4b8cc', mid: ['#5da040', '#77b548', '#e9aac4'], conifer: '#2f6f46',
    bush: '#5cae40', hill: '#4c8a50', field: '#9cc255', dirt: '#b38456', flowers: ['#f8f0f8', '#f7d840', '#e889b8', '#b99ae8'], snow: 0 },
  summer: { grass: '#5c9a34', grass2: '#7aa83c', leaf: ['#4c8a34', '#548f36', '#46822f'], mid: ['#4f8c38', '#5d9a3e', '#3f7a33'], conifer: '#2c6340',
    bush: '#58a33a', hill: '#3f7a4a', field: '#86b04c', dirt: '#b08050', flowers: ['#fbf6ea', '#f6d236', '#f08c3c', '#c890e8'], snow: 0 },
  autumn: { grass: '#8f9a3e', grass2: '#a8a046', leaf: ['#d9782c', '#e0a032', '#c4522a', '#b8a038'], mid: ['#d4822e', '#c9a13a', '#b75532', '#7e8a3a'], conifer: '#2f5f3e',
    bush: '#a89a3a', hill: '#7c7a44', field: '#c4a454', dirt: '#a8774a', flowers: ['#f5e6c8', '#e8b030', '#c85a30'], snow: 0 },
  winter: { grass: '#e9eef6', grass2: '#dfe6f2', leaf: [], mid: [], conifer: '#2a5a44', bush: '#7a8a70', hill: '#dce5f0', field: '#eef2f8', dirt: '#b8b0ac',
    flowers: [], snow: 1 }
};
const MAT = { bark: '#6f4d34', rock: '#8c8c90', moss: '#6a8a3a', water: '#4c8ec8', snow: '#f4f7fc', mountain: '#8a8698', pine: '#2c6340' };

// ---------- the rig for a scene ----------
function makeRig(time, sunSide, weather) {
  const R = Object.assign({}, RIGS[time] || RIGS.noon);

// ---------- ambient life ----------
function particleConfig(ctx) {
  const { set, rig, S: SEA } = ctx, out = [];
  if (!set.particles) return out;
  if (set.season === 'winter') out.push({ kind: 'snow', n: 140 });
  else if (set.season === 'autumn') out.push({ kind: 'leaves', n: 26 });
  else if (set.season === 'spring') out.push({ kind: 'petals', n: 30 });
  if (rig.night || set.time === 'dusk' || set.time === 'sunset') { if (set.season !== 'winter') out.push({ kind: 'fireflies', n: set.time === 'sunset' ? 12 : 30 }); }
  if (set.birds && !rig.night) out.push({ kind: 'birds', n: 5 });

}

// FILM FINISH: the v1 engine's HD output stage, ported to true colour. The pixel frame stays the base layer (crisp, drawn

//             the crisp pixels

//             lens fringe toward the corners and fine animated grain

    }
    s1.append(el('div', { class: 'row' }, [el('label', {}, [el('span', { text: 'Scene type' }), el('b', { text: T.label })]), el('p', { class: 'hint', text: 'The biggest choice: what kind of place you are painting. Each type has its own features below.' }), tg]));
    const vg = el('div', { class: 'presets' });
    for (const lib of LIBRARY.filter((l) => l.scene === type)) for (const v of lib.variants) {
      const id = lib.id + '-' + v.id, b = el('button', { title: v.prompt, onclick: () => { set = Object.assign(presetSettings(id), keep(), { prompt: v.prompt }); heard = []; buildPanel(); requestBuild(true); } }, [thumbCanvas(id), el('span', { text: (v.id === 'base' ? lib.title : v.name) })]);
      b.dataset.preset = id; vg.appendChild(b);
    }
    s1.append(el('div', { class: 'row' }, [el('label', {}, [el('span', { text: 'Start from' })]), el('p', { class: 'hint', text: 'Ready-made versions of this scene. Pick one, then change anything below.' }), vg]));
    // 2 - light and weather
    const light = ['time', 'weather', 'clouds', 'sunSide'].filter((k) => !hide.includes(k));
    const s2 = section('2', type === 'underwater' ? 'Light' : 'Light & weather', 'These change the mood of the whole picture the most.');
    light.forEach((k) => s2.appendChild(control(k)));
    // 3 - camera and style
    const s3 = section('3', 'Camera & style', 'How the shot is framed, how pixelated or HD it looks, how much the light glows, and a colour grade.');
    ['camera', 'hd', 'film', 'grade'].forEach((k) => s3.appendChild(control(k)));
    // 4 - the scene's own features
    const s4 = section('4', T.label + ' features', 'What is in the scene.');
    T.main.forEach((k) => s4.appendChild(control(k)));
    // 5 - amounts
    let n = 5;
    if (T.detail.length) { const s5 = section(String(n++), 'Amounts', 'Fine-tune how much of each thing there is.'); T.detail.forEach((k) => s5.appendChild(control(k))); }
    // last - motion and variation
    const s6 = section(String(n), 'Motion & variation', 'What moves, and a different arrangement of the same scene.');
    const an = el('input', { type: 'checkbox' }); an.onchange = () => { playing = an.checked; dirty = true; refreshUI(); };
    s6.appendChild(el('div', { class: 'row' }, [el('label', { class: 'toggle' }, [el('span', { text: 'Animate' }), an]), el('p', { class: 'hint', text: 'Clouds drift, plants and people sway, water glints, lights flicker.' })]));
    ctl.animate = { set: () => { an.checked = playing; } };
    ['birds', 'particles'].filter((k) => !hide.includes(k)).forEach((k) => s6.appendChild(control(k)));
    const seed = el('input', { type: 'number', min: 0, max: 999999, step: 1, 'aria-label': 'Seed' });
    seed.onchange = () => edit('seed', Math.max(0, Math.floor(+seed.value || 0)));
    s6.appendChild(el('div', { class: 'row' }, [el('label', {}, [el('span', { text: 'Seed' })]), el('p', { class: 'hint', text: 'The same settings with a different arrangement: where trees, people and clouds fall. Keep a number you like.' }), el('div', { class: 'inline' }, [seed, el('button', { class: 'btn', text: 'New variation', onclick: reseed })])]));
    ctl.seed = { set: (v) => { seed.value = v; } };
    refreshUI();
  }
  const keep = () => ({ res: set.res, birds: set.birds, particles: set.particles });
  function describe(text) {
    if (!text.trim()) return;
    const { set: patch, seen } = parseDescription(text);
    const type = patch.scene || set.scene, lib = LIBRARY.find((l) => l.scene === type);
    const base = type !== set.scene ? presetSettings(lib.id + '-base') : Object.assign({}, set);
    set = Object.assign(base, keep(), patch, { preset: 'custom', prompt: text, seed: Math.floor(Math.random() * 999999) });
    heard = seen.length ? seen : ['nothing specific, so a fresh variation'];
    buildPanel(); requestBuild(true);
  }
  function refreshUI() {
    for (const k in ctl) ctl[k].set(k === 'animate' ? playing : set[k]);
    document.querySelectorAll('.presets button').forEach((b) => b.classList.toggle('on', b.dataset.preset === set.preset));
    const p = PRESETS[set.preset];
    $('#sceneName').textContent = p ? p.label : 'Custom scene';
    const iw = scene ? (scene.outW || scene.W) : 480; $('#sceneInfo').textContent = (SCENE_TYPES[set.scene] || SCENE_TYPES.landscape).label + ' \u00b7 ' + iw + '\u00d7' + Math.round(iw * 9 / 16) + (scene && scene.finish > 0 ? ' HD' : '') + ' \u00b7 seed ' + set.seed;
    $('#play').textContent = playing ? 'Pause' : 'Play';
  }
  function busy(on) { $('#busy').classList.toggle('on', on); }
  let toastT = 0;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

  // ---------- actions ----------
  function reseed() { set.seed = Math.floor(Math.random() * 999999); set.preset = 'custom'; requestBuild(true); }
  function surprise() {
    const R = (a) => a[Math.floor(Math.random() * a.length)], f = () => Math.round(Math.random() * 20) / 20, lib = R(LIBRARY), v = R(lib.variants);
    set = Object.assign(presetSettings(lib.id + '-' + v.id), keep(), { preset: 'custom', seed: Math.floor(Math.random() * 999999), time: R(['sunrise', 'morning', 'noon', 'golden', 'sunset', 'dusk', 'night']), weather: R(['clear', 'clear', 'clear', 'rain', 'fog', 'snow']), clouds: f() });
    heard = []; buildPanel(); requestBuild(true);
  }
  function fileName(ext, w, h) { return 'pixel-studio-' + (PRESETS[set.preset] ? set.preset : set.scene) + '-' + set.seed + '-' + w + 'x' + h + '.' + ext; }
  function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
  function exportPNG(outH) {
    if (!scene) return;
    const k = Math.max(1, Math.round(outH / view.height)), c = document.createElement('canvas'); c.width = view.width * k; c.height = view.height * k;
    const g = c.getContext('2d'); drawFinished(g, c.width, c.height);
    c.toBlob((b) => { save(b, fileName('png', c.width, c.height)); toast('Saved ' + c.width + '×' + c.height + ' PNG'); }, 'image/png');
  }
  function record(sec) {
    if (!scene || recording) return;
    const k = Math.round(1080 / view.height), c = document.createElement('canvas'); c.width = view.width * k; c.height = view.height * k;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    if (!c.captureStream || typeof MediaRecorder === 'undefined') { toast('Recording is not supported in this browser'); return; }
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
    const rec = new MediaRecorder(c.captureStream(30), { mimeType: mime, videoBitsPerSecond: 14e6 }), chunks = [];
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = () => { save(new Blob(chunks, { type: 'video/webm' }), fileName('webm', c.width, c.height)); recording = null; $('#rec').textContent = 'Record 10 s'; toast('Saved ' + sec + ' s WebM'); };
    playing = true; refreshUI();
    recording = { draw: () => drawFinished(g, c.width, c.height) };
    recording.draw(); rec.start();
    let left = sec; $('#rec').textContent = 'Recording ' + left + ' s';
    const iv = setInterval(() => { left--; if (left > 0) $('#rec').textContent = 'Recording ' + left + ' s'; else { clearInterval(iv); rec.stop(); } }, 1000);
  }
  // the frame at export size: crisp pixels, with the smooth HD finish and its glow laid over when the slider asks for it
  function drawFinished(g, w, h) {
    if (useFilm()) {
      if (!filmOut) filmOut = makeFinish(document.createElement('canvas'));
      if (filmOut) { filmOut.render(img.data, img.width, img.height, scene.fin, w, h); g.imageSmoothingEnabled = false; g.drawImage(filmOut.canvas, 0, 0, w, h); return; }
    }
    const f = scene ? scene.finish || 0 : 0;
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none'; g.imageSmoothingEnabled = false; g.drawImage(view, 0, 0, w, h);
    if (f <= 0) return;
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.globalAlpha = f; g.drawImage(view, 0, 0, w, h);
    if ('filter' in g) { g.filter = 'blur(' + Math.round(w / 320) + 'px) saturate(1.2)'; g.globalCompositeOperation = 'screen'; g.globalAlpha = f * 0.22; g.drawImage(view, 0, 0, w, h); }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  }
  function copyLink() { writeHash(); (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(() => toast('Link copied'), () => toast('Copy the address bar to share this scene')); }

  // ---------- thumbnails of every library scene, painted one by one in their own worker ----------
  const thumbCache = {}; let thumbsStarted = false;
  function drawThumb(c) { const src = thumbCache[c.dataset.thumb]; if (!src) return; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(src, 0, 0, c.width, c.height); }
  function startThumbs() {
    thumbsStarted = true;
    const w = mkWorker(); if (!w) return;
    const ids = []; for (const l of LIBRARY) ids.push(l.id + '-base'); for (const l of LIBRARY) for (const v of l.variants) if (v.id !== 'base') ids.push(l.id + '-' + v.id);
    let i = 0;
    const next = () => { if (i >= ids.length) { w.terminate(); return; } w.postMessage({ id: i, set: Object.assign(presetSettings(ids[i]), { fixedRes: 320, particles: false, birds: false }) }); };
    w.onmessage = (e) => {
      const sc = e.data.sc, id = ids[e.data.id], im = new ImageData(sc.outW || sc.W, sc.outH || sc.H);
      compose(sc, 3, im.data);
      const tmp = document.createElement('canvas'); tmp.width = im.width; tmp.height = im.height; tmp.getContext('2d').putImageData(im, 0, 0);
      thumbCache[id] = tmp;
      document.querySelectorAll('canvas[data-thumb="' + id + '"]').forEach(drawThumb);
      i++; next();
    };
    next();
  }

  // ---------- wire up ----------
  $('#play').onclick = () => { playing = !playing; dirty = true; refreshUI(); };
  $('#new').onclick = reseed;
  $('#surprise').onclick = surprise;
  $('#png').onclick = () => exportPNG(1080);
  $('#png4k').onclick = () => exportPNG(2160);
  $('#rec').onclick = () => record(10);
  $('#link').onclick = copyLink;
  window.addEventListener('keydown', (e) => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); playing = !playing; dirty = true; refreshUI(); }
    else if (e.key === 'r' || e.key === 'R') reseed();
    else if (e.key === 's' || e.key === 'S') surprise();
    else if (e.key === 'e' || e.key === 'E') exportPNG(1080);
  });
  readHash();
  if (!set.prompt && PRESETS[set.preset]) { const lib = LIBRARY.find((l) => set.preset.startsWith(l.id + '-')); const v = lib && lib.variants.find((q) => set.preset === lib.id + '-' + q.id); if (v) set.prompt = v.prompt; }
  buildPanel();
  requestBuild(true);
  requestAnimationFrame(loop);
})();

</script>
