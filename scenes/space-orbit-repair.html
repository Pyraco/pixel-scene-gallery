<script>
"use strict";
(() => {

/* ==========================================================================
   TEST 6 - SPACE, ISOMETRIC: "Orbit Repair"
   Resolved options (non-defaults marked *):
     OUTPUT_MODE loop · LOOP_SECONDS 40* · RESOLUTION 320x180 · FRAME full* · WORLD_W 1.25* · WORLD_H 1
     PROJECTION isometric* · TRAVEL none (the camera drifts to follow the EVA)* · ENVIRONMENT space* · ERA sci-fi*
     SETTING a small orbital station: habitation module, lattice truss, a rotary joint and two solar wings,
       above a blue planet*
     TIME timeless* · WEATHER n/a · ATMOSPHERE none* (space: no haze) · SKY stars + nebula band*
     LIGHT_STYLE side-lit* (hard sun from screen-left, above) · KEY sun, visible in the corner with a lens flare*
     PRACTICALS nav beacons (red, green), antenna strobe (white), cabin windows (warm), welding arc (cyan)*
     SHADOWS none (nothing near enough to receive them)* · shadow faces go near-black* · RIM on (hard, sun side)
     MOOD quiet, precise, vast* · GRADE cool with warm accents* · PALETTE 47*
     SUBJECT_COUNT 2* · S1 astronaut in a white EVA suit, gold visor, tethered* · S2 repair drone, blue eye, companion*
     INTERACTION pass-object (the drone hands over a new solar cell)*
     BEATS hatch opens -> traverse the truss hand over hand -> weld the joint (sparks) -> take the cell from the
           drone and fit it (status light turns green) -> look at the planet -> traverse back -> hatch closes*
     LOOP_CLOSE a micrometeoroid cracks the same cell again (the status light returns to red)*
     EFFECT_1 sparks (burst, weightless)* · EFFECT_2 thruster puffs* · AMBIENT twinkling stars, rotating planet + clouds*
     SHOTS slow pan along the station with the traverse, hold on the repair, pan back* · FOREGROUND off* (space)
   ========================================================================== */
const TITLE = 'Orbit Repair';
const W = 320, H = 180, IMG_TOP = 0, IMG_BOT = 180;             // full frame
const LOOP_FRAMES = 2400;                                       // 40 s
const SEED = 3, OUTPUT_MODE = 'loop', STILL_T = 18.4, DEBUG_KEYS = true, EXPORT_SCALES = [1, 4];
const WW = 400;

const PAL_HEX = [
  '#030308', '#0a0a14', '#0f1024', '#16183a',                   // 0-3   space blacks
  '#2a1f4e', '#4a2a6a', '#1f4a5e',                              // 4-6   nebula
  '#ffffff', '#a8b0d8', '#5a6090',                              // 7-9   stars
  '#fff4c8', '#f0c060',                                         // 10-11 sun glow
  '#1a4a8a', '#2a6ab0', '#0e2a50', '#5ab0e8', '#b8e8ff',        // 12-16 planet: ocean, ocean lit, night, limb, limb bright
  '#e8f0f8', '#8aa0c0', '#2a3a5a',                              // 17-19 clouds: lit, shade, night
  '#6a8a4a', '#3a5a3a', '#ffc860',                              // 20-22 land lit, land, city lights
  '#f0f0f4', '#b8bcc8', '#6a6e80', '#2a2c3a',                   // 23-26 hull / suit: lit -> near-black
  '#f0c850', '#b0842a', '#5a4020',                              // 27-29 gold foil
  '#3a5ab8', '#1e2e6a', '#10183a', '#8ab0ff',                   // 30-33 solar cells: edge, cell, shade, glint
  '#9a9aa8', '#5a5a6a',                                         // 34-35 truss metal
  '#ff4a3a', '#4aff7a', '#ffd890',                              // 36-38 beacons red, green, warm window
  '#ffcc40', '#b07a18',                                         // 39-40 visor
  '#d04030',                                                    // 41    suit stripe
  '#4ab8ff', '#cfefff',                                         // 42-43 drone eye / arc light
  '#ffe8a0', '#f08a30',                                         // 44-45 sparks
  '#d8e0f0'                                                     // 46    thruster puff
];
const K0 = 0, K1 = 1, SP0 = 2, SP1 = 3, NB0 = 4, NB1 = 5, NB2 = 6, ST0 = 7, ST1 = 8, ST2 = 9, SN0 = 10, SN1 = 11,
      PL0 = 12, PL1 = 13, PL2 = 14, PL3 = 15, PL4 = 16, CL0 = 17, CL1 = 18, CL2 = 19, LN0 = 20, LN1 = 21, CT0 = 22,
      HL0 = 23, HL1 = 24, HL2 = 25, HL3 = 26, GD0 = 27, GD1 = 28, GD2 = 29, SL0 = 30, SL1 = 31, SL2 = 32, SL3 = 33,
      TR0 = 34, TR1 = 35, BR0 = 36, BG0 = 37, WN0 = 38, VS0 = 39, VS1 = 40, RD0 = 41, DR0 = 42, DR1 = 43, SPK = 44, SPK2 = 45, TH0 = 46;

// ==========================================================================
// CORE A - shared engine: palette tables, framebuffer, primitives, PRNG
// (expects W, H, IMG_TOP, IMG_BOT, PAL_HEX, LOOP_FRAMES, SEED from the scene)
// ==========================================================================
const NP = PAL_HEX.length, CLEAR = 255, STEP = 1 / 60, TAU = Math.PI * 2, LOOP = LOOP_FRAMES / 60;
const PAL32 = new Uint32Array(NP);
for (let i = 0; i < NP; i++) {
  const v = parseInt(PAL_HEX[i].slice(1), 16);
  PAL32[i] = (0xff000000 | ((v & 0xff) << 16) | (v & 0xff00) | ((v >> 16) & 0xff)) >>> 0;
}
// Palette remap table: identity except for the listed [from, to] pairs. 256 wide so CLEAR maps to itself.
function makeLUT(pairs) {
  const l = new Uint8Array(256);
  for (let i = 0; i < 256; i++) l[i] = i;
  for (let i = 0; i < pairs.length; i += 2) l[pairs[i]] = pairs[i + 1];
  return l;
}

// ---- framebuffer + draw target (any index buffer, with a translation) ----
const FB = new Uint8Array(W * H);
let TB = FB, TW = W, TY0 = IMG_TOP, TY1 = IMG_BOT, TOX = 0, TOY = 0;
function target(buf, w, h, ox, oy) {
  TB = buf; TW = w; TOX = ox || 0; TOY = oy || 0;
  if (buf === FB) { TY0 = IMG_TOP; TY1 = IMG_BOT; } else { TY0 = 0; TY1 = h; }
}
const BAYER = new Uint8Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5]);
function bay(x, y) { return BAYER[((y & 3) << 2) | (x & 3)]; }
function px(x, y, c) {
  x += TOX; y += TOY;
  if (x < 0 || x >= TW || y < TY0 || y >= TY1) return;
  TB[y * TW + x] = c;
}
function rect(x, y, w, h, c) {
  x += TOX; y += TOY;
  const x0 = x < 0 ? 0 : x, x1 = x + w > TW ? TW : x + w;
  const y0 = y < TY0 ? TY0 : y, y1 = y + h > TY1 ? TY1 : y + h;
  for (let yy = y0; yy < y1; yy++) { const o = yy * TW; for (let xx = x0; xx < x1; xx++) TB[o + xx] = c; }
}
function hline(x0, x1, y, c) { if (x1 < x0) { const t = x0; x0 = x1; x1 = t; } rect(x0, y, x1 - x0 + 1, 1, c); }

function drect(x, y, w, h, a, b, lvl) {
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) px(xx, yy, lvl > bay(xx, yy) ? b : a);
}
function remapAt(x, y, lut) {
  x += TOX; y += TOY;
  if (x < 0 || x >= TW || y < TY0 || y >= TY1) return;
  const i = y * TW + x, v = TB[i];
  if (v !== CLEAR) TB[i] = lut[v];
}
function getAt(x, y) {
  x += TOX; y += TOY;

  return TB[y * TW + x];
}
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) {
    px(x0, y0, c);

    const e2 = 2 * e;

    if (e2 <= dx) { e += dx; y0 += sy; }

}
function edgeF(ax, ay, bx, by, x, y) { return (bx - ax) * (y - ay) - (by - ay) * (x - ax); }
// Convex quad fill (points in order, either winding), sampled at pixel centres.
function quad(ax, ay, bx, by, cx, cy, dx, dy, c) {
  const x0 = Math.floor(Math.min(ax, bx, cx, dx)), x1 = Math.ceil(Math.max(ax, bx, cx, dx));
  const y0 = Math.floor(Math.min(ay, by, cy, dy)), y1 = Math.ceil(Math.max(ay, by, cy, dy));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const X = x + 0.5, Y = y + 0.5;
    const e0 = edgeF(ax, ay, bx, by, X, Y), e1 = edgeF(bx, by, cx, cy, X, Y);
    const e2 = edgeF(cx, cy, dx, dy, X, Y), e3 = edgeF(dx, dy, ax, ay, X, Y);

  }

  const x0 = Math.floor(cx - rx), x1 = Math.ceil(cx + rx), y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const u = (x + 0.5 - cx) / rx, v = (y + 0.5 - cy) / ry;
    if (u * u + v * v <= 1) px(x, y, c);
  }
}
// Radial dithered remap (glows, pools, soft shadows): level falls from maxLvl at the centre to 0 at the edge.
function glow(cx, cy, rx, ry, lut, maxLvl) {
  const x0 = Math.floor(cx - rx), x1 = Math.ceil(cx + rx), y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const u = (x + 0.5 - cx) / rx, v = (y + 0.5 - cy) / ry, d = u * u + v * v;

// ---- PRNG + math (no allocation) ----
let rs = (SEED * 0x9E3779B1) | 0;

  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function ease(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
function easeSine(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return 0.5 - 0.5 * Math.cos(t * Math.PI); }
function ri(v) { return Math.round(v); }
function hash(n) { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
let frame = 0, gT = 0;
// sin with k whole cycles per loop (anything built from this loops seamlessly)
function cyc(k, ph) { return Math.sin(TAU * gT * k / LOOP + ph); }

// ---- camera helpers (CAMERA_SMOOTHING): critically damped spring + low-pass filter ----
// spring(): st[i] = position, st[i+1] = velocity; optional maxAcc (px/s^2, 0 = none) for very-smooth.
function spring(st, i, target, smoothTime, maxAcc) {
  const om = 2 / smoothTime, x = om * STEP, ex = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  const ch = st[i] - target, tmp = (st[i + 1] + om * ch) * STEP;
  let v = (st[i + 1] - om * tmp) * ex;
  if (maxAcc > 0) { const dv = v - st[i + 1], lim = maxAcc * STEP; if (dv > lim) v = st[i + 1] + lim; else if (dv < -lim) v = st[i + 1] - lim; }

function lowpass(cur, target, tau) { return cur + (target - cur) * (1 - Math.exp(-STEP / tau)); }

// round(off) one pixel at a time, and only on frames where that step would not reverse the camera's recent motion.
// The subject never wobbles on screen and the background never steps back and forth.
const PF_OFF = new Int32Array(2), PF_CAM = new Int32Array(2), PF_DIR = new Int8Array(2), PF_IDLE = new Uint16Array(2), PF_ON = new Uint8Array(2);
function pixelFollow(a, subj, off, lo, hi) {

  if (!PF_ON[a]) { PF_ON[a] = 1; PF_OFF[a] = want; PF_CAM[a] = clamp(s + want, lo, hi); return PF_CAM[a]; }
  if (want !== PF_OFF[a]) {
    const d = want > PF_OFF[a] ? 1 : -1, step = clamp(s + PF_OFF[a] + d, lo, hi) - PF_CAM[a];
    if (step === 0 || PF_DIR[a] === 0 || (step > 0 ? 1 : -1) === PF_DIR[a]) PF_OFF[a] += d;

// ---- vignette + frame bars ----
const VIG = new Uint8Array(W * H);
function buildVignette(strength) {                  // 0 off, 1 subtle, 2 medium, 3 strong
  const cx = (W - 1) / 2, cy = (IMG_TOP + IMG_BOT - 1) / 2, hx = W / 2, hy = (IMG_BOT - IMG_TOP) / 2;
  for (let y = IMG_TOP; y < IMG_BOT; y++) for (let x = 0; x < W; x++) {
    const nx = (x - cx) / hx, ny = (y - cy) / hy, a = nx * nx, b = ny * ny;
    VIG[y * W + x] = strength ? clamp(ri((a * a + b * b * 0.7 + 0.6 * a * b - 0.55) * (6 + strength * 6)), 0, 15) : 0;
  }
}
function applyVignette(lut) {
  for (let y = IMG_TOP; y < IMG_BOT; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (VIG[i] > bay(x, y)) FB[i] = lut[FB[i]];
  }
}
function frameBars(c) { FB.fill(c, 0, IMG_TOP * W); FB.fill(c, IMG_BOT * W); }

// ---- lit sprite blit: rim on exposed edges, lit band, shaded interior, selective outline ----
const NORIM = new Uint8Array(256);                  // 1 = material keeps its own highlight (metal, glass)
let sBuf = FB, sW = 0, sH = 0, sFlip = false;
function sop(x, y) {
  if (x < 0 || y < 0 || x >= sW || y >= sH) return false;
  return sBuf[y * sW + (sFlip ? sW - 1 - x : x)] !== CLEAR;
}
// rimR/rimL/rimT: rim colour where the right/left/top neighbour is empty (CLEAR = no rim on that side).
// out/outSide: outline colour in empty pixels left (-1) / right (1) / all round (2) of the shape, 0 = none.
// lit: lit-band width behind a rim; deeper pixels take shade[] (null = no shading). light[]: metal highlight.
function blitLit(buf, w, h, ox, oy, flip, rimR, rimL, rimT, out, outSide, lit, shade, groundRows, light) {
  sBuf = buf; sW = w; sH = h; sFlip = flip;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = buf[y * w + (flip ? w - 1 - x : x)], X = ox + x, Y = oy + y;
    if (v === CLEAR) {
      if (out === CLEAR || outSide === 0) continue;
      let o;
      if (outSide === -1) o = sop(x + 1, y);
      else if (outSide === 1) o = sop(x - 1, y);
      else o = sop(x + 1, y) || sop(x - 1, y) || sop(x, y + 1) || sop(x, y - 1);
      if (o) px(X, Y, out);
      continue;
    }
    const ground = y >= h - groundRows;
    // a rim needs 2+ px of thickness behind it, so 1-px limbs and props don't turn into glowing sticks
    const eR = rimR !== CLEAR && !sop(x + 1, y) && sop(x - 1, y), eL = rimL !== CLEAR && !sop(x - 1, y) && sop(x + 1, y);
    const eT = rimT !== CLEAR && !sop(x, y - 1) && sop(x, y + 1);

    if (!ground && (eR || eL || eT)) c = NORIM[v] ? light[v] : (eR ? rimR : eL ? rimL : rimT);

        near = (rimR !== CLEAR && !sop(x + d, y)) || (rimL !== CLEAR && !sop(x - d, y)) || (rimT !== CLEAR && !sop(x, y - d));

// ---------- remap tables ----------
const SHADE = makeLUT([HL0, HL1, HL1, HL2, HL2, HL3, HL3, K1, GD0, GD1, GD1, GD2, GD2, K1, SL0, SL1, SL1, SL2, SL2, K1, SL3, SL0,
  TR0, TR1, TR1, HL3, VS0, VS1, VS1, GD2, RD0, GD2, DR0, SL1, DR1, DR0, ST0, ST1, ST1, ST2, SP1, SP0, SP0, K1, PL1, PL0, PL0, PL2,
  CL0, CL1, CL1, CL2, LN0, LN1, TH0, HL2, SPK, SPK2, WN0, GD1]);
const LIGHT = makeLUT([K1, HL3, HL3, HL2, HL2, HL1, HL1, HL0, GD2, GD1, GD1, GD0, SL2, SL1, SL1, SL0, SL0, SL3, TR1, TR0, VS1, VS0,
  SP0, SP1, SP1, NB0, PL2, PL0, PL0, PL1, PL1, PL3, CL2, CL1, CL1, CL0, ST2, ST1, ST1, ST0, SPK2, SPK]);
// the welding arc's colour: surfaces near the tip turn cool white-cyan
const ARC = makeLUT([HL3, DR0, HL2, DR0, HL1, DR1, HL0, DR1, TR1, DR0, TR0, DR1, SL2, SL1, SL1, DR0, SL0, DR1, GD2, HL2, GD1, HL1, GD0, HL0, K1, SL2]);
const FLARE = makeLUT([K0, SP1, K1, SP1, SP0, SP1, SP1, NB0, NB0, NB1, PL0, PL1, PL2, PL0, PL1, PL3, CL2, CL1, SL2, SL1, SL1, SL0, ST2, ST1]);

// ---------- isometric projection (2:1 tiles, 18 px per tile of height) ----------
const OX = 140, OY = 50, ZS = 18;
let PXo = 0, PYo = 0;
function P(i, j, z) { PXo = OX + (i - j) * 16; PYo = OY + (i + j) * 8 - z; }

const STA = new Uint8Array(WW * H), WINGM = new Uint8Array(WW * H);

// ---------- backdrop: stars + nebula (parallax 0.1), the sun and its flare (screen), the planet (parallax 0.3) ----------

    else if (PK[i] === 1) { if (a < 0.7 || ((x + y) & 1)) px(x, y, a < 0.4 ? TH0 : HL2); }
    else px(x, y, a < 0.5 ? HL1 : HL2);
  }
}

// ---------- bake, update, render ----------
function bake() { bakeStars(); bakePlanet(); bakeStation(); drawDrone(); buildVignette(1); }
let camF = 0, camI = 0, lastPose = -1, aSX = 0, aSY = 0, dSX = 0, dSY = 0, prevDI = 0, prevDJ = 0;
function update() {
  const t = gT;
  camF = camAt(t); camI = Math.round(camF);
  const slot = Math.floor(frame / 5);
  if (slot !== lastPose) { lastPose = slot; astroAt(slot * 5 / 60); drawAstro(AS.face, AS.arm, AS.work, AS.hold); }
  astroAt(t); P(AS.i, AS.j, AS.z); aSX = Math.round(PXo - camF); aSY = Math.round(PYo);
  droneAt(t); P(DRN.i, DRN.j, DRN.z); dSX = Math.round(PXo - camF); dSY = Math.round(PYo);
  // thruster puffs whenever the drone changes speed
  const vi = DRN.i - prevDI, vj = DRN.j - prevDJ; prevDI = DRN.i; prevDJ = DRN.j;
  if ((frame % 6) === 0 && (vi * vi + vj * vj) > 1e-5) { const h = hash(frame * 5 + 3); emit(camI + dSX - Math.sign(vi - vj) * 5, dSY + 1, -Math.sign(vi - vj) * (12 + h * 10), (h - 0.5) * 8, 0.45, 1); }
  // welding: bursts of sparks from the tool tip
  if (AS.work && t >= T_WELD0 && (frame % 12) < 3) {
    for (let q = 0; q < 3; q++) { const h = hash(frame * 11 + q), a = h * TAU, v = 25 + hash(frame * 3 + q + 7) * 50; emit(camI + aSX + (AS.flip ? -TOOLX : TOOLX), aSY + TOOLY, Math.cos(a) * v, Math.sin(a) * v, 0.3 + hash(frame + q * 17) * 0.5, 0); }
  }
  // micrometeoroid strike: debris from the cell
  if (frame === Math.round(T_HIT * 60) + 7) for (let q = 0; q < 10; q++) { const a = hash(q * 29 + 1) * TAU, v = 10 + hash(q * 13 + 2) * 26; emit(CELLX, CELLY, Math.cos(a) * v, Math.sin(a) * v - 6, 1.2 + hash(q) * 1.4, 2); }
  stepParticles();
}
const REDH = makeLUT([SP0, RD0, SP1, RD0, K1, GD2, HL3, GD2, HL2, RD0, HL1, RD0, TR1, RD0, SL2, GD2, SL1, RD0]);
const GRNH = makeLUT([SP0, LN1, SP1, LN1, K1, LN1, HL3, LN1, HL2, LN1, SL2, LN1, SL1, LN1, TR1, LN1]);
const WINH = makeLUT([HL3, GD2, HL2, GD1, HL1, GD0, K1, GD2, SP0, GD2, TR1, GD1]);
function beacon(x, y, on, lut, c) { if (!on) { px(x, y, HL3); return; } glow(x + 0.5, y + 0.5, 5, 5, lut, 10); px(x, y, c); px(x - 1, y, c); px(x + 1, y, c); px(x, y - 1, c); px(x, y + 1, c); px(x, y, ST0); }
function render() {
  const t = gT;
  // backdrop
  const so = Math.round(camF * P_STAR);
  for (let y = 0; y < H; y++) FB.set(STARS.subarray(y * STW + so, y * STW + so + W), y * W);
  for (let k = 0; k < TW_N; k++) { const x = TWX[k] - so; if (x < 0 || x >= W) continue; const v = cyc(TWK[k], k * 1.7); FB[TWY[k] * W + x] = v > 0.6 ? ST0 : v > -0.2 ? ST1 : ST2; }
  drawPlanet(camF);
  drawSun();
  // the station
  for (let y = 0; y < H; y++) { const s = y * WW + camI, d = y * W; for (let x = 0; x < W; x++) { const v = STA[s + x]; if (v !== CLEAR) FB[d + x] = v; } }
  // sun glint sweeping across the solar wings (two passes per loop)
  const gp = ((gT / LOOP) * 2 % 1) * 520 - 120;
  for (let y = 60; y < H; y++) for (let x = 0; x < W; x++) { const wx = x + camI; if (!WINGM[y * WW + wx]) continue; const d = wx + y * 2 - gp - 200; if (d > 0 && d < 9) { const i = y * W + x; FB[i] = d > 3 && d < 6 ? SL3 : SL0; } }
  target(FB, W, H, -camI, 0);
  // the cell: cracked (dark, star-shaped crack) or new (a brief sparkle after it's fitted)
  if (!cellNew(t)) { px(CELLX, CELLY, K1); px(CELLX - 1, CELLY, HL2); px(CELLX + 1, CELLY - 1, HL1); px(CELLX + 2, CELLY + 1, HL2); px(CELLX - 2, CELLY - 1, HL1); px(CELLX, CELLY + 1, K1); px(CELLX - 1, CELLY + 2, HL2); }
  else if (t < T_FIT + 1.2 && ((frame >> 2) & 1)) { px(CELLX, CELLY, SL3); px(CELLX - 1, CELLY, SL0); px(CELLX + 1, CELLY, SL0); }
  // cabin windows (warm light spilling onto the hull), beacons, antenna strobe, joint status light
  for (let k = 0; k < WIN_N; k++) { glow(WINX[k] + 0.5, WINY[k] + 0.5, 5, 4, WINH, 9); px(WINX[k], WINY[k], WN0); px(WINX[k] + 1, WINY[k], WN0); px(WINX[k], WINY[k] - 1, GD0); }
  beacon(BEAR_X, BEAR_Y, cyc(32, 0) > 0.8, REDH, BR0);
  beacon(BEAG_X, BEAG_Y, cyc(32, 2.2) > 0.8, GRNH, BG0);
  const fs = frame % 150; if (fs < 3 || (fs > 8 && fs < 11)) { glow(STRX + 0.5, STRY + 0.5, 6, 6, LIGHT, 12); px(STRX, STRY, ST0); }
  if (cellNew(t)) beacon(JOINTX, JOINTY, true, GRNH, BG0); else beacon(JOINTX, JOINTY, cyc(40, 0) > 0, REDH, BR0);
  // hatch: a round door that slides aside, warm light inside while it is open
  const open = t < T_HO0 ? 0 : t < T_HO1 ? easeSine((t - T_HO0) / (T_HO1 - T_HO0)) : t < T_HC0 ? 1 : t < T_HC1 ? 1 - easeSine((t - T_HC0) / (T_HC1 - T_HC0)) : 0;
  ellipse(HATCHX + 0.5, HATCHY + 0.5, 3.6, 4.2, HL2);
  if (open > 0) { ellipse(HATCHX + 0.5, HATCHY + 0.5, 2.6, 3.2, K1); px(HATCHX, HATCHY + 1, WN0); px(HATCHX - 1, HATCHY + 2, GD1); }
  ellipse(HATCHX + 0.5 + Math.round(open * 5), HATCHY + 0.5 - Math.round(open * 2), 2.6, 3.2, HL1);
  // tether from the hatch to the astronaut's waist, floating in a loose curve
  if (AS.vis) {
    target(FB, W, H, 0, 0);
    const x0 = HATCHX - camI, y0 = HATCHY, x1 = aSX, y1 = aSY - 10, len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(2, Math.round(len));
    for (let k = 0; k <= n; k++) { const u = k / n, sg = Math.sin(Math.PI * u) * (6 + len * 0.12), wv = 1.5 * Math.sin(u * TAU * 2 + TAU * 4 * gT / LOOP); px(Math.round(x0 + (x1 - x0) * u - sg * 0.3), Math.round(y0 + (y1 - y0) * u + sg + wv), (k & 3) ? GD1 : GD2); }
    // the astronaut: hard rim on the sun side, near-black shade, outline on the shadow side
    const fl = AS.flip;
    blitLit(ABUF, ABW, ABH, aSX - (fl ? ABW - 1 - AAX : AAX), aSY - AAY, fl, CLEAR, ST0, ST0, K1, 1, 1, SHADE, 2, LIGHT);
    if (AS.hold) { const hx = aSX + (fl ? -HANDX : HANDX), hy = aSY + HANDY; px(hx, hy, SL1); px(hx + 1, hy, SL0); px(hx, hy + 1, SL1); px(hx + 1, hy + 1, SL1); }
    if (AS.work && t >= T_WELD0) {                                     // welding arc: flickering cool light on nearby surfaces
      const tx = aSX + (fl ? -TOOLX : TOOLX), ty = aSY + TOOLY, fk = hash(frame >> 1);
      glow(tx + 0.5, ty + 0.5, 9 + fk * 5, 7 + fk * 4, ARC, 9 + fk * 5); px(tx, ty, ST0); if (fk > 0.4) { px(tx + 1, ty, DR1); px(tx, ty - 1, DR1); }
    }
  }
  // the drone, its eye, and the cell it carries until the hand-over
  blitLit(DBUF, DBW, DBH, dSX - DAX, dSY - DAY, false, CLEAR, ST0, ST0, K1, 1, 1, SHADE, 0, LIGHT);
  target(FB, W, H, 0, 0);
  glow(dSX + DRN.dir * 2 + 0.5, dSY + 0.5, 3.5, 3, ARC, 8); px(dSX + DRN.dir * 2, dSY, DR0); px(dSX + DRN.dir * 3, dSY, DR1); px(dSX + DRN.dir * 2, dSY - 1, DR0);
  if (cyc(20, 0.5) > 0.7) px(dSX - DRN.dir * 3, dSY - 2, BR0);          // running light
  if (DRN.carry) { px(dSX - 1, dSY + 4, SL1); px(dSX, dSY + 4, SL0); px(dSX + 1, dSY + 4, SL1); px(dSX, dSY + 5, SL1); }
  // micrometeoroid: a streak into the cell, then a flash
  const fh = frame - Math.round(T_HIT * 60);
  if (fh >= 0 && fh < 8) { const u = fh / 7, x = Math.round(CELLX - camI + 90 * (1 - u)), y = Math.round(CELLY - 70 * (1 - u)); line(x, y, x + 5, y - 4, SN0); px(x, y, ST0); }
  if (fh >= 7 && fh < 12) { glow(CELLX - camI + 0.5, CELLY + 0.5, 9, 8, LIGHT, 14); px(CELLX - camI, CELLY, ST0); }
  drawParticles(camI);
  // lens ghosts over everything, then a light vignette (no frame bars: full frame)
  for (let g = 0; g < 3; g++) { const f = g === 0 ? 0.55 : g === 1 ? 0.95 : 1.3, gx = SUNX + (160 - SUNX) * f, gy = SUNY + (90 - SUNY) * f; glow(gx, gy, 3 + g * 2, 3 + g * 2, FLARE, 5); }
  applyVignette(SHADE);
}

// ==========================================================================
// CORE B - shared engine: output, fixed-step loop, debug keys, PNG export
// (expects bake(), update(), render() from the scene)
// ==========================================================================
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H), out32 = new Uint32Array(img.data.buffer);
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.floor(innerWidth * dpr)), chh = Math.max(1, Math.floor(innerHeight * dpr));
  canvas.width = cw; canvas.height = chh;
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  scale = Math.max(1, Math.floor(Math.min(cw / W, chh / H)));
  offX = Math.floor((cw - W * scale) / 2); offY = Math.floor((chh - H * scale) / 2);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, chh);
}
function present() {
  for (let i = 0; i < W * H; i++) out32[i] = PAL32[FB[i]];
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, W, H, offX, offY, W * scale, H * scale);
}
function simStep() { frame = (frame + 1) % LOOP_FRAMES; gT = frame / 60; update(); }

function savePNG(mult) {
  const c = document.createElement('canvas'); c.width = W * mult; c.height = H * mult;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(off, 0, 0, W, H, 0, 0, W * mult, H * mult);
  c.toBlob((b) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = TITLE.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + mult + 'x.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}
function addExport() {
  const bar = document.createElement('div'); bar.id = 'export';
  for (let k = 0; k < EXPORT_SCALES.length; k++) {
    const m = EXPORT_SCALES[k], b = document.createElement('button');
    b.textContent = 'PNG ' + m + '×'; b.onclick = () => savePNG(m);
    bar.appendChild(b);
  }
  document.body.appendChild(bar);
}

// ---- boot: bake static layers, pre-roll one loop, optional seek ----
bake();
for (let i = 0; i < LOOP_FRAMES; i++) simStep();                 // stateful systems reach steady state
let startF = OUTPUT_MODE === 'still' ? ri(STILL_T * 60) % LOOP_FRAMES : 0;
const seekM = /t=(\d+(?:\.\d+)?)/.exec(location.hash);
if (seekM) startF = Math.floor(parseFloat(seekM[1]) * 60) % LOOP_FRAMES;
for (let i = 0; i < startF; i++) simStep();
resize();
window.addEventListener('resize', () => { resize(); present(); });

if (OUTPUT_MODE === 'still') {
  render(); present();
  if (EXPORT_SCALES.length) addExport();
} else {
  let last = performance.now(), acc = 0, paused = false;
  const tick = (now) => {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.25) dt = 0.25; else if (dt < 0) dt = 0;
    if (!paused) { acc += dt; while (acc >= STEP) { simStep(); acc -= STEP; } }
    render(); present();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  if (DEBUG_KEYS) window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
    else if (paused && e.code === 'ArrowRight') simStep();
    else if (paused && e.code === 'ArrowLeft') for (let i = 0; i < LOOP_FRAMES - 1; i++) simStep();
  });
  if (EXPORT_SCALES.length) addExport();
}
})();
