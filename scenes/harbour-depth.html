    x0 = Math.min(x0, sx3(X, z)); x1 = Math.max(x1, sx3(X, z)); y0 = Math.min(y0, sy3(h, z)); y1 = Math.max(y1, sy3(h, z));
  }
  DBX0[i] = clamp(Math.floor(x0), 0, W - 1); DBX1[i] = clamp(Math.ceil(x1), 0, W - 1); DBY0[i] = clamp(Math.floor(y0), 0, H - 1); DBY1[i] = clamp(Math.ceil(y1), 0, H - 1);
}
function lightOn(i) { return i === 3 ? lanternLit : LAMPS_ON; }
function drawLightsD() {
  const nk = NIGHT ? 1.25 : 1;
  for (let i = 0; i < DL_N; i++) {
    if (!lightOn(i)) continue;
    const fl = i === 3 ? lanternFlick : 1, R = DLR[i], R2 = R * R, maxL = 20 * PRACT * nk * fl;
    for (let y = DBY0[i]; y <= DBY1[i]; y++) for (let x = DBX0[i]; x <= DBX1[i]; x++) {       // pool: coloured inside, brightening at the edge
      const idx = y * W + x, s = SURF[idx]; if (s !== S_QUAY && s !== S_WALL) continue;
      const z = ZB[idx]; let X, h;
      if (s === S_QUAY) { X = (x + 0.5 - VPX) * z / FOC; h = 0; } else { X = QX0; h = CAMH - (y + 0.5 - HZ) * z / FOC; }
      const dX = X - DLX[i], dH = h - DLH[i], dZ = z - DLZ[i], d2 = dX * dX + dH * dH + dZ * dZ; if (d2 >= R2) continue;
      const l = (1 - Math.sqrt(d2) / R) * maxL;
      if (l > bay(x, y)) FB[idx] = (l > 7 ? LAMPC : LIGHT_L)[FB[idx]];
      if (l - 16 > bay(x + 2, y + 1)) FB[idx] = LAMPC[FB[idx]];
    }
    const hx = sx3(DLX[i], DLZ[i]), hy = sy3(DLH[i], DLZ[i]), gy = sy3(0, DLZ[i]), s = FOC / DLZ[i];
    const hw = 1.1 * s * PRACT, lvl = 8 * CONE_K * nk * fl;                  // cone in the air (needs rain / fog / snow to show)
    for (let y = ri(hy + 1); y <= gy; y++) {
      const f = (y - hy) / Math.max(1, gy - hy), w = 1 + f * hw;
      for (let x = Math.floor(hx - w); x <= hx + w; x++) {
        if (x < 0 || x >= W || y < IMG_TOP || y >= IMG_BOT) continue;
        const c = (1 - Math.abs(x - hx) / w) * lvl * (1 - f * 0.5);
        if (c > bay(x, y + (frame >> 3))) FB[y * W + x] = (c > lvl * 0.45 ? LAMPC : LIGHT_L)[FB[y * W + x]];
      }
    }
    glow(hx, hy, 0.9 * s * PRACT + 2, 0.8 * s * PRACT + 2, LAMPC, 20 * fl);  // halo in the lamp's colour
  }
}
function drawPropsD() {
  if (crateOnStack || !F.vis) box3(-4.5, -3.7, 0.5, 1.0, 10.2, 11.0, WD0, WD1, WD1);
  if (crateAtStall && F.vis) box3(-3.6, -3.0, 0, 0.5, 5.7, 6.2, WD0, WD1, WD1);
  for (let i = 0; i < DL_N; i++) {                                           // lamp heads / lantern body
    const z = DLZ[i], hx = ri(sx3(DLX[i], z)), hy = ri(sy3(DLH[i], z)), r = Math.max(1, ri(0.16 * FOC / z));
    rect(hx - r - 1, hy - r - 1, 2 * r + 3, 2 * r + 3, IRON);
    rect(hx - r, hy - r, 2 * r + 1, 2 * r + 1, lightOn(i) ? (i === 3 && lanternFlick < 0.5 ? L1 : L0) : ST2);
    if (lightOn(i)) px(hx, hy, SUN0);
    if (i === 3) vline(hx, ri(sy3(2.3, z)), hy - r - 2, IRON);
  }
}
// wet reflections: lamp heads mirrored on the flagstones (ripple jitter only up close)
const RB = new Uint8Array(W * H);
function drawReflectionsD() {
  if (O_WEATHER !== 'rain' || !fxOn('reflect')) return;
  RB.fill(CLEAR); target(RB, W, H);
  for (let i = 0; i < DL_N; i++) if (lightOn(i)) { const z = DLZ[i]; q3(DLX[i] - 0.15, -DLH[i] - 0.2, z, DLX[i] + 0.15, -DLH[i] - 0.2, z, DLX[i] + 0.15, -DLH[i] + 0.2, z, DLX[i] - 0.15, -DLH[i] + 0.2, z, L0); }
  target(FB, W, H);
  const wob = frame >> 3;
  for (let y = HZ; y < H; y++) {
    const zr = CAMH * FOC / (y + 0.5 - HZ), jx = zr < 14 ? ((hash(y * 73 + wob) * 3) | 0) - 1 : 0;
    for (let x = 0; x < W; x++) {
      const i = y * W + x; if (SURF[i] !== S_QUAY) continue;
      const sx = x + jx; if (sx < 0 || sx >= W) continue;
      if (RB[y * W + sx] !== CLEAR && (PUD[i] ? 14 : 7) > bay(x, y)) FB[i] = PUD[i] ? L0 : L1;
    }
  }
}

// ---------- particles: rain / snow (screen slice), steam, sparks, splashes, ripples ----------
const PN = 400, AMB = O_WEATHER === 'rain' ? 180 : O_WEATHER === 'snow' ? 150 : 0;
const P_SPARK = 1, P_STEAM = 2, P_SPLASH = 3;
const pX = new Float32Array(PN), pY = new Float32Array(PN), pVX = new Float32Array(PN), pVY = new Float32Array(PN);
const pAge = new Float32Array(PN), pLife = new Float32Array(PN), pK = new Float32Array(PN), pType = new Uint8Array(PN);
let pNext = AMB, prevT = 0;
for (let i = 0; i < AMB; i++) { pX[i] = rnd() * W; pY[i] = rnd() * H; pK[i] = 0.3 + rnd() * 0.7; pVY[i] = O_WEATHER === 'rain' ? 140 + 200 * pK[i] : 8 + 14 * pK[i]; pVX[i] = rnd() * TAU; }
function spawn(type, x, y, vx, vy, life) {
  for (let n = 0; n < PN - AMB; n++) {
    const i = AMB + ((pNext - AMB + n) % (PN - AMB)); if (pType[i] !== 0) continue;
    pType[i] = type; pX[i] = x; pY[i] = y; pVX[i] = vx; pVY[i] = vy; pAge[i] = 0; pLife[i] = life;
    pNext = i + 1 >= PN ? AMB : i + 1; return;
  }
}
const STOVE_X = sx3(-4.22, 3.67), STOVE_Y = sy3(1.2, 3.67);
function stepParticlesD() {
  const t = gT;
  if (F.vis && FSIDE && prevT < 23.2 && t >= 23.2) {
    const hx = FSX + (F.face < 0 ? -1 : 1) * (F.handX + 2), hy = FFY + F.handY - 1;
    for (let k = 0; k < 11; k++) spawn(P_SPARK, hx, hy, (rnd() - 0.5) * 40, -10 - rnd() * 30, 0.25 + rnd() * 0.35);
  }
  if ((prevT < 3.3 && t >= 3.3) || (prevT < 57.3 && t >= 57.3)) { const x = sx3(5.5, 13), y = sy3(WATER_H, 13); for (let k = 0; k < 8; k++) spawn(P_SPLASH, x + (rnd() - 0.5) * 3, y, (rnd() - 0.5) * 20, -15 - rnd() * 18, 0.5); }
  if (O_SUBJ === 1 && prevT < 30.5 && t >= 30.5) { const x = sx3(3.4, 6.4), y = sy3(WATER_H, 6.4); for (let k = 0; k < 8; k++) spawn(P_SPLASH, x, y, (rnd() - 0.5) * 26, -20 - rnd() * 20, 0.5); }
  if (frame % 18 === 0) spawn(P_STEAM, STOVE_X + (rnd() - 0.5) * 4, STOVE_Y, (rnd() - 0.3) * 5 + (t > 34 && t < 37 ? 10 : 0), -9 - rnd() * 4, 2.6);
  if (O_WEATHER === 'rain') for (let a = 0; a < 3; a++) {                   // splashes only up close (distant ones read as noise)
    const x = (rnd() * W) | 0, y = HZ + 10 + ((rnd() * (H - HZ - 10)) | 0), i = y * W + x;
    if ((SURF[i] === S_QUAY || SURF[i] === S_WATER) && ZB[i] < 14) spawn(P_SPLASH, x, y, 0, -8, 0.1);
  }
  prevT = t;
  for (let i = 0; i < AMB; i++) {
    if (O_WEATHER === 'rain') { pY[i] += pVY[i] * STEP; pX[i] += pVY[i] * 0.12 * STEP; if (pY[i] > H + 4) { pY[i] -= H + 10; pX[i] = rnd() * (W + 40) - 20; } }
    else { pY[i] += pVY[i] * STEP; pX[i] += Math.sin(gT * 1.3 + pVX[i]) * 6 * pK[i] * STEP; if (pY[i] > H + 2) { pY[i] -= H + 4; pX[i] = rnd() * W; } }
  }
  for (let i = AMB; i < PN; i++) {
    const ty = pType[i]; if (ty === 0) continue;
    pAge[i] += STEP; if (ty !== P_STEAM) pVY[i] += 140 * STEP;
    pX[i] += pVX[i] * STEP; pY[i] += pVY[i] * STEP;
    if (pAge[i] >= pLife[i]) pType[i] = 0;
  }
}
function drawParticlesD() {
  for (let i = AMB; i < PN; i++) {
    const ty = pType[i]; if (ty === 0) continue;
    const x = ri(pX[i]), y = ri(pY[i]), a = pAge[i] / pLife[i];
    if (ty === P_SPARK) px(x, y, a < 0.4 ? L0 : a < 0.75 ? L1 : RIM);
    else if (ty === P_SPLASH) px(x, y, a < 0.5 ? G0 : SEA0);
    else { const r = 2 + pAge[i] * 2.4; glow(x, y, r, r * 0.8, LIGHT, 10 * (1 - a)); }
  }
  for (let i = 0; i < AMB; i++) {
    const x = ri(pX[i]), y = ri(pY[i]), k = pK[i];
    if (O_WEATHER === 'rain') { if (k < 0.45 && (i & 1)) continue; const L = 2 + ri(4 * k); for (let j = 0; j < L; j++) px(ri(pX[i] - 0.12 * j), y - j, j ? SNOW : (k > 0.6 ? G0 : SNOW)); }
    else { px(x, y, G0); if (k > 0.75) { px(x + 1, y, G0); px(x, y + 1, SNOW); } }
  }
}
function drawGullsD() {
  for (let k = 0; k < 3; k++) {
    const x = ri(100 + k * 70 + 40 * cyc(1 + k, k)), y = ri(30 + k * 8 + 6 * cyc(2 + k, k * 1.3)), fl = ((frame >> 3) + k * 3) % 6 < 2 ? 1 : 0;
    if (SURF[y * W + x] !== S_SKY) continue;
    px(x, y, G0); px(x - 1, y - fl, G0); px(x + 1, y - fl, G0); px(x - 2, y - fl * 2, ST1); px(x + 2, y - fl * 2, ST1);
  }
}
function drawFogBanksD() {
  if (O_WEATHER !== 'fog') return;
  for (let y = HZ - 6; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, band = 0.5 + 0.5 * Math.sin(x * 0.03 + y * 0.25 + TAU * gT * 2 / LOOP), near = clamp((y - HZ) / (H - HZ), 0, 1);
    const l = band * (6 + 8 * (1 - near));                                    // thicker toward the horizon
    if (l > bay(x, y)) FB[i] = FOGL[FB[i]];
    if (l - 9 > bay(x + 2, y + 1)) FB[i] = FOGL[FB[i]];
  }
}
// near-black foreground: bunting overhead, a bollard and rope coil close to the camera
const FGB = new Uint8Array(W * H);
function bakeFgD() {
  for (let x = 0; x < W; x++) {
    const y = ri(IMG_TOP + 2 + 8 * Math.sin(Math.PI * ((x % 160) / 160)));
    FGB[y * W + x] = 1;
    if (x % 12 === 0) for (let r = 1; r <= 5; r++) for (let c = -2 + (r >> 1); c <= 2 - (r >> 1); c++) { const xx = x + c, yy = y + r; if (xx >= 0 && xx < W) FGB[yy * W + xx] = 1; }
  }
  for (let y = IMG_BOT - 16; y < IMG_BOT; y++) for (let x = W - 40; x < W - 24; x++) FGB[y * W + x] = 1;
  for (let y = IMG_BOT - 8; y < IMG_BOT; y++) for (let x = W - 70; x < W - 44; x++) { const u = (x - (W - 57)) / 13, v = (y - IMG_BOT) / 8; if (u * u + v * v < 1) FGB[y * W + x] = 1; }
}

// ---------- simulation + composition ----------
function bake() { bakeDepth(); bakeFgD(); buildVignette(fxOn('vignette') ? 1 : 0); }
function update() { updateScene(gT); stepParticlesD(); }
const P16 = new Uint8Array(256);
{
  const SUB = [K0, K1, SKY0, SKY2, SUN0, HAZ1, SEA1, SEA3, ST0, ST1, WD0, WD2, CLR, Y0, SK0, G0];
  const rgb = (i) => { const v = parseInt(PAL_HEX[i].slice(1), 16); return [v >> 16, (v >> 8) & 255, v & 255]; };
  for (let i = 0; i < 256; i++) P16[i] = i;
  for (let i = 0; i < NP; i++) { const a = rgb(i); let best = SUB[0], bd = 1e9; for (const s of SUB) { const b = rgb(s), d = (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2; if (d < bd) { bd = d; best = s; } } P16[i] = best; }
}
function render() {
  FB.set(BG); target(FB, W, H);
  drawSkyD(); drawWaterFx(); drawBoatsD(); drawGullsD();
  drawPropsD();
  drawReflectionsD();
  drawLightsD();
  subjectsD();
  if (fishFly >= 0 && F.vis) {                                                 // the fish arcs from his hand to the cat (or the water)
    const x0 = FSX + F.handX, y0 = FFY - 28, x1 = O_SUBJ >= 2 ? ri(sx3(CAT_X3, CAT_Z3)) + 4 : ri(sx3(3.4, 6.4)), y1 = O_SUBJ >= 2 ? ri(sy3(CAT_H3, CAT_Z3)) - 9 : ri(sy3(WATER_H, 6.4));
    const x = ri(lerp(x0, x1, fishFly)), y = ri(lerp(y0, y1, fishFly) - 18 * 4 * fishFly * (1 - fishFly)), tl = ((frame >> 2) & 1) ? 1 : -1;
    rect(x - 3, y - 2, 7, 4, K1); hline(x - 2, x + 2, y, FS0); hline(x - 1, x + 1, y - 1, FS0); px(x + 3 * tl, y, FS1);
  }
  drawParticlesD();
  drawFogBanksD();
  if (fxOn('fg')) { const sw = cyc(16, 0) > 0.4 ? 1 : 0; for (let y = IMG_TOP; y < IMG_BOT; y++) for (let x = 0; x < W; x++) { const xs = x - (y < IMG_TOP + 16 ? sw : 0); if (xs >= 0 && FGB[y * W + xs]) FB[y * W + x] = K1; } }
  applyVignette(SHADE);
  frameBars(K0);
  if (O_PAL === 16) for (let i = 0; i < W * H; i++) FB[i] = P16[FB[i]];
}

// ==========================================================================
// CORE B - shared engine: output, fixed-step loop, debug keys, PNG export
// (expects bake(), update(), render() from the scene)
// ==========================================================================
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H), out32 = new Uint32Array(img.data.buffer);
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.floor(innerWidth * dpr)), chh = Math.max(1, Math.floor(innerHeight * dpr));
  canvas.width = cw; canvas.height = chh;
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  scale = Math.max(1, Math.floor(Math.min(cw / W, chh / H)));
  offX = Math.floor((cw - W * scale) / 2); offY = Math.floor((chh - H * scale) / 2);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, chh);
}
function present() {
  for (let i = 0; i < W * H; i++) out32[i] = PAL32[FB[i]];
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, W, H, offX, offY, W * scale, H * scale);
}
function simStep() { frame = (frame + 1) % LOOP_FRAMES; gT = frame / 60; update(); }

function savePNG(mult) {
  const c = document.createElement('canvas'); c.width = W * mult; c.height = H * mult;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(off, 0, 0, W, H, 0, 0, W * mult, H * mult);
  c.toBlob((b) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = TITLE.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + mult + 'x.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}
function addExport() {
  const bar = document.createElement('div'); bar.id = 'export';
  for (let k = 0; k < EXPORT_SCALES.length; k++) {
    const m = EXPORT_SCALES[k], b = document.createElement('button');
    b.textContent = 'PNG ' + m + '×'; b.onclick = () => savePNG(m);
    bar.appendChild(b);
  }
  document.body.appendChild(bar);
}

// ---- boot: bake static layers, pre-roll one loop, optional seek ----
bake();
for (let i = 0; i < LOOP_FRAMES; i++) simStep();                 // stateful systems reach steady state
let startF = OUTPUT_MODE === 'still' ? ri(STILL_T * 60) % LOOP_FRAMES : 0;
const seekM = /t=(\d+(?:\.\d+)?)/.exec(location.hash);
if (seekM) startF = Math.floor(parseFloat(seekM[1]) * 60) % LOOP_FRAMES;
for (let i = 0; i < startF; i++) simStep();
resize();
window.addEventListener('resize', () => { resize(); present(); });

if (OUTPUT_MODE === 'still') {
  render(); present();
  if (EXPORT_SCALES.length) addExport();
} else {
  let last = performance.now(), acc = 0, paused = false;
  const tick = (now) => {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.25) dt = 0.25; else if (dt < 0) dt = 0;
    if (!paused) { acc += dt; while (acc >= STEP) { simStep(); acc -= STEP; } }
    render(); present();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  if (DEBUG_KEYS) window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
    else if (paused && e.code === 'ArrowRight') simStep();
    else if (paused && e.code === 'ArrowLeft') for (let i = 0; i < LOOP_FRAMES - 1; i++) simStep();
  });
  if (EXPORT_SCALES.length) addExport();
}
})();
