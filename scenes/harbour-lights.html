"use strict";

const O_PAL = +qopt('palette', '48', ['16', '48']);
const O_DETAIL = qopt('detail', 'balanced', ['minimal', 'balanced', 'rich']);

const SPK = O_DITHER === 'soft' ? 0.35 : O_DITHER === 'strong' ? 1.3 : 1;    // texture speckle density

/* ==========================================================================

     camera=dolly|locked|drift|cuts      dither=soft|medium|strong    palette=48|16

     output=loop|still                   env=exterior|interior

     lamp posts, lighthouse beam · SHAFTS on · SHADOWS long · MOOD calm, salty, homeward · PALETTE 48
     subjects: fisherman (lead), cat (companion), child (passer-by, subjects=3) · INTERACTION pass-object
     BEATS gaze at the lighthouse -> fetch a crate -> light the lantern -> toss a fish to the cat ->

     EFFECTS sparks (match), steam (soup pot), splash (gull dive / fish) · AMBIENT gulls, dust motes
     STATE_CHANGES lights-on, crate moved · CAMERA establishing-dolly -> follow -> push-in -> return

  '#c98f58', '#8a5a3e', '#4f3530',                                         // 18-20 timber
  '#c8453c', '#efe0bd', '#b89a6a',                                         // 21-23 awning red, cream, net/rope

  overcast: ['#bfc2c8', '#aaaeb6', '#959aa4', '#80858f', '#dcdee2', '#c9ccd2', '#9aa0a8', '#7f858f', '#626873', '#c9d0d8', '#8e98a3', '#6b7683', '#4c5663', '#d9dbe0']

{

  const sky = SKYSET[tk];

  for (let i = 0; i < ROLE_HEX.length; i++) {

    if (t === 's') { PAL_HEX.push(sky[si++]); continue; }
    if (t === 'r') { PAL_HEX.push(sky[13]); continue; }
    if (t === 'f' || t === 'e') { PAL_HEX.push(ROLE_HEX[i]); continue; }

    const w = t === 'l' ? 1 : t === 'm' ? 0.5 : 0;                                        // lit -> key tint, shadow -> ambient
    const out = [0, 0, 0];

      SEA0 = 11, SEA1 = 12, SEA2 = 13, SEA3 = 14, ST0 = 15, ST1 = 16, ST2 = 17, WD0 = 18, WD1 = 19, WD2 = 20,
      CLR = 21, CLC = 22, NET = 23, B0 = 24, B1 = 25, FS0 = 26, FS1 = 27, SK0 = 28, SK1 = 29, SK2 = 30,
      Y0 = 31, Y1 = 32, TR0 = 33, TR1 = 34, GRY = 35, C0 = 36, C1 = 37, L0 = 38, L1 = 39, G0 = 40, GR0 = 41, GR1 = 42,
      RIM = 43, KC = 44, KC1 = 45, IRON = 46, SNOW = 47;

// ==========================================================================
// CORE A - shared engine: palette tables, framebuffer, primitives, PRNG

// ==========================================================================

const PAL32 = new Uint32Array(NP);

  target(FB, W, H);
  FLAG.fill(0);
  drawSky(cam); drawClouds(cam); drawHeadland(cam); drawSea(cam); drawHarbour(cam); drawBeam(cam); drawGulls(cam);
  for (let y = IMG_TOP; y < IMG_BOT; y++) {
    const o = y * WW + cam, r = y * W;
    for (let x = 0; x < W; x++) { const v = QUAY[o + x]; if (v !== CLEAR) { FB[r + x] = v; FLAG[r + x] = 2; } }
  }
  drawProps(cam);
  if (CAT.vis) drawCat();
  if (F.vis) drawFisherman();
  if (KID.vis) drawKid();
  target(FB, W, H);
  const fsx = ri(F.x) - cam, csx = POT_X + 9 - cam, ksx = ri(KID.x) - cam;
  if (F.vis) { castShadow(FBUF, F.face < 0, fsx, FEET_Y, cam); glow(fsx, FEET_Y + 1, 6, 1.6, SHADE, 13); }
  if (KID.vis) { castShadow(KBUF, true, ksx, 151, cam); glow(ksx, 152, 4, 1.3, SHADE, 12); }
  drawShafts();
  drawFog(cam);
  drawPractical(cam);
  drawWetReflections(cam);
  if (CAT.vis) blitSubject(CBUF, csx, 132, false);
  if (F.vis) blitSubject(FBUF, fsx, FEET_Y, F.face < 0);
  if (fishFly >= 0) {                                                          // pass-object: the fish arcs to the cat (or the water)
    const x0 = STALL + 7, y0 = FEET_Y - 28, x1 = O_SUBJ >= 2 ? POT_X + 4 : STALL + 30, y1 = O_SUBJ >= 2 ? 123 : 127;
    const x = ri(lerp(x0, x1, fishFly)) - cam, y = ri(lerp(y0, y1, fishFly) - 16 * 4 * fishFly * (1 - fishFly));
    if (O_SUBJ >= 2 || y < QUAY_TOP) {                                       // dark outline: a thrown prop must read against anything (B6)
      const tl = ((frame >> 2) & 1) ? 1 : -1;
      rect(x - 3, y - 2, 7, 4, K1); px(x + 4 * tl, y - 1, K1); px(x + 4 * tl, y + 1, K1);
      hline(x - 2, x + 2, y, FS0); hline(x - 1, x + 1, y - 1, FS0); px(x + 3 * tl, y, FS1); px(x - 2 * tl, y - 1, K1);
    }
  }
  if (KID.vis) blitSubject(KBUF, ksx, 151, true);
  drawParticles(cam);
  drawWeather();
  if (O_ENV === 'interior') {
    for (let i = IMG_TOP * W; i < IMG_BOT * W; i++) if (INT[i] !== CLEAR) { FB[i] = INT[i]; FLAG[i] = 3; }
    pool(293, 95, 34 * PRACT, 30 * PRACT, 17 * PRACT * (0.85 + 0.15 * hash(frame >> 2)), 3, LAMPC);
  }
  drawForeground(cam);
  drawTitle();
  applyVignette(SHADE);
  if (fadeLvl > 0) for (let y = IMG_TOP; y < IMG_BOT; y++) for (let x = 0; x < W; x++) if (fadeLvl > bay(x, y)) FB[y * W + x] = K0;
  frameBars(K0);
  if (O_PAL === 16) for (let i = 0; i < W * H; i++) FB[i] = P16[FB[i]];
}

// ==========================================================================
// CORE B - shared engine: output, fixed-step loop, debug keys, PNG export
// (expects bake(), update(), render() from the scene)
// ==========================================================================
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H), out32 = new Uint32Array(img.data.buffer);
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.floor(innerWidth * dpr)), chh = Math.max(1, Math.floor(innerHeight * dpr));
  canvas.width = cw; canvas.height = chh;
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  scale = Math.max(1, Math.floor(Math.min(cw / W, chh / H)));
  offX = Math.floor((cw - W * scale) / 2); offY = Math.floor((chh - H * scale) / 2);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, chh);
}
function present() {
  for (let i = 0; i < W * H; i++) out32[i] = PAL32[FB[i]];
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, W, H, offX, offY, W * scale, H * scale);
}
function simStep() { frame = (frame + 1) % LOOP_FRAMES; gT = frame / 60; update(); }

function savePNG(mult) {
  const c = document.createElement('canvas'); c.width = W * mult; c.height = H * mult;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(off, 0, 0, W, H, 0, 0, W * mult, H * mult);
  c.toBlob((b) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = TITLE.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + mult + 'x.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}
function addExport() {
  const bar = document.createElement('div'); bar.id = 'export';
  for (let k = 0; k < EXPORT_SCALES.length; k++) {
    const m = EXPORT_SCALES[k], b = document.createElement('button');
    b.textContent = 'PNG ' + m + '×'; b.onclick = () => savePNG(m);
    bar.appendChild(b);
  }
  document.body.appendChild(bar);
}

// ---- boot: bake static layers, pre-roll one loop, optional seek ----
bake();
for (let i = 0; i < LOOP_FRAMES; i++) simStep();                 // stateful systems reach steady state
let startF = OUTPUT_MODE === 'still' ? ri(STILL_T * 60) % LOOP_FRAMES : 0;
const seekM = /t=(\d+(?:\.\d+)?)/.exec(location.hash);
if (seekM) startF = Math.floor(parseFloat(seekM[1]) * 60) % LOOP_FRAMES;
for (let i = 0; i < startF; i++) simStep();
resize();
window.addEventListener('resize', () => { resize(); present(); });

if (OUTPUT_MODE === 'still') {
  render(); present();
  if (EXPORT_SCALES.length) addExport();
} else {
  let last = performance.now(), acc = 0, paused = false;
  const tick = (now) => {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.25) dt = 0.25; else if (dt < 0) dt = 0;
    if (!paused) { acc += dt; while (acc >= STEP) { simStep(); acc -= STEP; } }
    render(); present();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  if (DEBUG_KEYS) window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
    else if (paused && e.code === 'ArrowRight') simStep();
    else if (paused && e.code === 'ArrowLeft') for (let i = 0; i < LOOP_FRAMES - 1; i++) simStep();
  });
  if (EXPORT_SCALES.length) addExport();
}
})();
</script>
</body>
