"use strict";

// ==========================================================================

    pType[i] = type; pX[i] = x; pY[i] = y; pVX[i] = vx; pVY[i] = vy; pAge[i] = 0; pLife[i] = life;
    pNext = i + 1 >= PN ? AMB : i + 1; return;
  }
}
function stepParticlesT() {
  const t = gT, dcx = tcx - lastCX, dcy = tcy - lastCY; lastCX = tcx; lastCY = tcy;
  if (F.vis && prevT < 23.2 && t >= 23.2) for (let k = 0; k < 11; k++) spawn(P_SPARK, TFX + 6, TFY - 30, (rnd() - 0.5) * 40, -10 - rnd() * 30, 0.25 + rnd() * 0.35);
  if ((prevT < 3.3 && t >= 3.3) || (prevT < 57.3 && t >= 57.3)) for (let k = 0; k < 9; k++) spawn(P_SPLASH, 330 + (rnd() - 0.5) * 3, 70, (rnd() - 0.5) * 30, -25 - rnd() * 25, 0.5);
  if (O_SUBJ === 1 && prevT < 30.5 && t >= 30.5) for (let k = 0; k < 8; k++) spawn(P_SPLASH, 232, 138, (rnd() - 0.5) * 26, -20 - rnd() * 20, 0.5);
  if (frame % 18 === 0) spawn(P_STEAM, T_STALL0 - 8 + (rnd() - 0.5) * 3, 178, (rnd() - 0.3) * 4 + (t > 34 && t < 37 ? 8 : 0), -8 - rnd() * 3, 2.6);
  if (O_WEATHER === 'rain') for (let a = 0; a < 3; a++) {
    const wx = tcx + rnd() * W, wy = tcy + rnd() * VIEW_H, g = GTYPE[(wy | 0) * WW + (wx | 0)];
    if (g === 1) spawn(P_RIPPLE, wx, wy, 0, 0, 0.45); else spawn(P_SPLASH, wx, wy, 0, -8, 0.1);
  }
  prevT = t;
  for (let i = 0; i < AMB; i++) {
    if (O_WEATHER === 'rain') { pY[i] += pVY[i] * STEP - dcy; pX[i] += pVY[i] * 0.12 * STEP - dcx; }
    else { pY[i] += pVY[i] * STEP - dcy; pX[i] += Math.sin(gT * 1.3 + pVX[i]) * 6 * pK[i] * STEP - dcx; }
    if (pY[i] > IMG_BOT + 4) { pY[i] -= VIEW_H + 8; pX[i] = rnd() * W; } else if (pY[i] < IMG_TOP - 8) pY[i] += VIEW_H + 8;
    if (pX[i] < -20) pX[i] += W + 40; else if (pX[i] > W + 20) pX[i] -= W + 40;
  }
  for (let i = AMB; i < PN; i++) {
    const ty = pType[i]; if (ty === 0) continue;
    pAge[i] += STEP; if (ty === P_SPARK || ty === P_SPLASH) pVY[i] += 140 * STEP;
    pX[i] += pVX[i] * STEP; pY[i] += pVY[i] * STEP;
    if (pAge[i] >= pLife[i]) pType[i] = 0;
  }
}
function drawParticlesT(cx, cy) {
  for (let i = AMB; i < PN; i++) {
    const ty = pType[i]; if (ty === 0) continue;
    const x = ri(pX[i]) - cx, y = ri(pY[i]) - cy + IMG_TOP, a = pAge[i] / pLife[i];
    if (ty === P_SPARK) px(x, y, a < 0.4 ? L0 : a < 0.75 ? L1 : RIM);
    else if (ty === P_SPLASH) px(x, y, a < 0.5 ? G0 : SEA0);
    else if (ty === P_RIPPLE) { const r = 1 + a * 3.5; for (let s = 0; s < 10; s++) { const an = s * TAU / 10; remapAt(ri(x + Math.cos(an) * r), ri(y + Math.sin(an) * r * 0.6), LIGHT); } }
    else { const r = 1.5 + pAge[i] * 1.8; glow(x, y, r, r * 0.8, LIGHT, 10 * (1 - a)); }
  }
  for (let i = 0; i < AMB; i++) {
    const x = ri(pX[i]), y = ri(pY[i]), k = pK[i];
    if (O_WEATHER === 'rain') { const L = 2 + ri(3 * k); for (let j = 0; j < L; j++) px(ri(pX[i] - 0.12 * j), y - j, j ? SNOW : (k > 0.6 ? G0 : SNOW)); }
    else { px(x, y, G0); if (k > 0.75) { px(x + 1, y, G0); px(x, y + 1, SNOW); } }
  }
}
function drawGullsT(cx, cy) {
  for (let k = 0; k < 3; k++) {
    const wx = 150 + k * 150 + 60 * cyc(1 + k, k), wy = 40 + k * 20 + 14 * cyc(2 + k, k * 1.3), fl = ((frame >> 3) + k * 3) % 6 < 2 ? 1 : 0;
    const x = ri(wx) - cx, y = ri(wy) - cy + IMG_TOP;
    px(x, y, G0); px(x - 1, y - fl, G0); px(x + 1, y - fl, G0); px(x - 2, y - fl * 2, ST1); px(x + 2, y - fl * 2, ST1);
    remapAt(x + 6, y + 10, SHADE);                                            // its shadow on the water
  }
  for (let d = 0; d < 2; d++) {                                                // the diving gull
    const t0 = d ? 56.3 : 2.3, u = (gT - t0) / 2; if (u < 0 || u > 1) continue;
    const x = ri(lerp(250, 330, u)) - cx, y = ri(u < 0.5 ? lerp(10, 70, (u / 0.5) ** 2) : lerp(70, 20, (u - 0.5) / 0.5)) - cy + IMG_TOP;
    px(x, y, G0); px(x - 1, y - 1, G0); px(x + 1, y - 1, G0);
  }
}
function drawFogT() {
  if (O_WEATHER !== 'fog') return;
  for (let y = IMG_TOP; y < IMG_BOT; y++) for (let x = 0; x < W; x++) {
    const band = 0.55 + 0.45 * Math.sin((x + tcx) * 0.02 + (y + tcy) * 0.05 + TAU * gT * 2 / LOOP);
    const l = band * 14, i = y * W + x;
    if (l > bay(x, y)) FB[i] = FOGL[FB[i]];
    if (l - 9 > bay(x + 2, y + 1)) FB[i] = FOGL[FB[i]];
  }
}
// near-black bunting strands overhead (parallax 1.4)
function drawFgT() {
  if (!fxOn('fg')) return;
  const o = ri(tcx * 1.4), oy = ri(tcy * 0.4), sw = cyc(16, 0) > 0.4 ? 1 : 0;
  for (let x = 0; x < W; x++) {
    const wx = x + o, y = IMG_TOP + 3 + ri(8 * Math.sin(Math.PI * ((wx % 150) / 150))) - oy + 12;
    if (y < IMG_TOP - 2) continue;
    px(x, y, K1);
    if (wx % 12 === 0) for (let r = 1; r <= 5; r++) for (let c = -2 + (r >> 1); c <= 2 - (r >> 1); c++) px(x + c + sw, y + r, K1);
  }
}

// ---------- simulation + composition ----------
function bake() { bakeTop(); buildVignette(fxOn('vignette') ? 1 : 0); }
function update() { updateScene(gT); poseT(); stepCameraT(); stepParticlesT(); }
const P16 = new Uint8Array(256);
{
  const SUB = [K0, K1, SKY0, SKY2, SUN0, HAZ1, SEA1, SEA3, ST0, ST1, WD0, WD2, CLR, Y0, SK0, G0];
  const rgb = (i) => { const v = parseInt(PAL_HEX[i].slice(1), 16); return [v >> 16, (v >> 8) & 255, v & 255]; };
  for (let i = 0; i < 256; i++) P16[i] = i;
  for (let i = 0; i < NP; i++) { const a = rgb(i); let best = SUB[0], bd = 1e9; for (const s of SUB) { const b = rgb(s), d = (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2; if (d < bd) { bd = d; best = s; } } P16[i] = best; }
}
const TKEY = new Float32Array(9), TORD = new Uint8Array(9);
function render() {
  const cx = tcx, cy = tcy;
  target(FB, W, H);
  for (let y = IMG_TOP; y < IMG_BOT; y++) { const o = (y - IMG_TOP + cy) * WW + cx, r = y * W; for (let x = 0; x < W; x++) FB[r + x] = GROUND[o + x]; }
  drawWaterT(cx, cy); drawBoatsT(cx, cy); drawLighthouseT(cx, cy);
  lightsGroundT(cx, cy);
  // depth-sorted props + subjects (three-quarter: by base y)
  TKEY[0] = 194; TKEY[1] = 194.1; TKEY[2] = 194.2; TKEY[3] = crateAtStall && F.vis ? 212 : -1; TKEY[4] = F.vis ? TFY + 0.5 : -1;
  TKEY[5] = 214.8; TKEY[6] = 236; TKEY[7] = 236; TKEY[8] = 236;
  for (let i = 0; i < 9; i++) TORD[i] = i;
  for (let i = 1; i < 9; i++) { const v = TORD[i]; let j = i - 1; while (j >= 0 && TKEY[TORD[j]] > TKEY[v]) { TORD[j + 1] = TORD[j]; j--; } TORD[j + 1] = v; }
  for (let n = 0; n < 9; n++) {
    const k = TORD[n]; if (TKEY[k] < 0) continue;
    if (k === 0) { drawStallT(cx, cy); drawLanternT(cx, cy); }
    else if (k === 1) drawMiscT(cx, cy);
    else if (k === 2) { drawCrateT(T_CRATE_X, 194, cx, cy); if (crateOnStack || !F.vis) drawCrateT(T_CRATE_X, 184, cx, cy); }
    else if (k === 3) drawCrateT(188, 212, cx, cy);
    else if (k === 4) drawFishermanT();
    else if (k === 5) { drawPotT(T_POT_X, 214, cx, cy); if (CAT.vis) { drawCat(); target(FB, W, H); blitT(CBUF, T_POT_X + 1, 204, false); } }
    else drawLampT(k - 6, cx, cy);
  }
  lightsAirT(cx, cy);
  if (fishFly >= 0 && F.vis) {                                                  // the fish arcs from his hand to the cat (or into the water)
    const x0 = TFX + 8 - cx, y0 = TFY - 28 - cy + IMG_TOP, x1 = (O_SUBJ >= 2 ? T_POT_X - 3 : 232) - cx, y1 = (O_SUBJ >= 2 ? 196 : 140) - cy + IMG_TOP;
    const x = ri(lerp(x0, x1, fishFly)), y = ri(lerp(y0, y1, fishFly) - 16 * 4 * fishFly * (1 - fishFly)), tl = ((frame >> 2) & 1) ? 1 : -1;
    rect(x - 3, y - 2, 7, 4, K1); hline(x - 2, x + 2, y, FS0); hline(x - 1, x + 1, y - 1, FS0); px(x + 3 * tl, y, FS1);
  }
  drawParticlesT(cx, cy);
  drawGullsT(cx, cy);
  drawFogT();
  drawFgT();
  applyVignette(SHADE);
  if (tFade > 0) for (let y = IMG_TOP; y < IMG_BOT; y++) for (let x = 0; x < W; x++) if (tFade > bay(x, y)) FB[y * W + x] = K0;
  frameBars(K0);
  if (O_PAL === 16) for (let i = 0; i < W * H; i++) FB[i] = P16[FB[i]];
}

// ==========================================================================
// CORE B - shared engine: output, fixed-step loop, debug keys, PNG export
// (expects bake(), update(), render() from the scene)
// ==========================================================================
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H), out32 = new Uint32Array(img.data.buffer);
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.floor(innerWidth * dpr)), chh = Math.max(1, Math.floor(innerHeight * dpr));
  canvas.width = cw; canvas.height = chh;
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  scale = Math.max(1, Math.floor(Math.min(cw / W, chh / H)));
  offX = Math.floor((cw - W * scale) / 2); offY = Math.floor((chh - H * scale) / 2);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, chh);
}
function present() {
  for (let i = 0; i < W * H; i++) out32[i] = PAL32[FB[i]];
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, W, H, offX, offY, W * scale, H * scale);
}
function simStep() { frame = (frame + 1) % LOOP_FRAMES; gT = frame / 60; update(); }

function savePNG(mult) {
  const c = document.createElement('canvas'); c.width = W * mult; c.height = H * mult;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(off, 0, 0, W, H, 0, 0, W * mult, H * mult);
  c.toBlob((b) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = TITLE.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + mult + 'x.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}
function addExport() {
  const bar = document.createElement('div'); bar.id = 'export';
  for (let k = 0; k < EXPORT_SCALES.length; k++) {
    const m = EXPORT_SCALES[k], b = document.createElement('button');
    b.textContent = 'PNG ' + m + '×'; b.onclick = () => savePNG(m);
    bar.appendChild(b);
  }
  document.body.appendChild(bar);
}

// ---- boot: bake static layers, pre-roll one loop, optional seek ----
bake();
for (let i = 0; i < LOOP_FRAMES; i++) simStep();                 // stateful systems reach steady state
let startF = OUTPUT_MODE === 'still' ? ri(STILL_T * 60) % LOOP_FRAMES : 0;
const seekM = /t=(\d+(?:\.\d+)?)/.exec(location.hash);
if (seekM) startF = Math.floor(parseFloat(seekM[1]) * 60) % LOOP_FRAMES;
for (let i = 0; i < startF; i++) simStep();
resize();
window.addEventListener('resize', () => { resize(); present(); });

if (OUTPUT_MODE === 'still') {
  render(); present();
  if (EXPORT_SCALES.length) addExport();
} else {
  let last = performance.now(), acc = 0, paused = false;
  const tick = (now) => {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.25) dt = 0.25; else if (dt < 0) dt = 0;
    if (!paused) { acc += dt; while (acc >= STEP) { simStep(); acc -= STEP; } }
    render(); present();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  if (DEBUG_KEYS) window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
    else if (paused && e.code === 'ArrowRight') simStep();
    else if (paused && e.code === 'ArrowLeft') for (let i = 0; i < LOOP_FRAMES - 1; i++) simStep();
  });
  if (EXPORT_SCALES.length) addExport();
}
})();
</script>
