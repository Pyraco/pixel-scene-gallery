<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Underwater Temple</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
  #export { position: fixed; right: 10px; bottom: 10px; display: flex; gap: 6px; opacity: .35; transition: opacity .2s; font: 12px/1 system-ui, sans-serif; }
  #export:hover { opacity: 1; }

</style>

<body>
<canvas id="screen"></canvas>
<script>
"use strict";
(() => {
/* ==========================================================================
   SCENE - "Underwater Temple" (generated from pixel-scene-prompt.md with the user's Section A).
   A temple on a sunlit seabed at dawn. The camera trucks right from behind a coral bommie and reveals the temple
   at the end of a paved processional way, then holds on it while a turtle glides past; a dithered fade closes the loop.
   Resolved options (explicit values win over LOOK defaults; * = derived from auto or a conflict):
     LOOK neon-noir -> every default it sets is overridden by an explicit option (dawn, top-lit, warm-mono, subtle
       practicals, no sky). Its transferable rules are kept*: a colour table per practical with narrow-dither pools
       (1 step: PRACTICAL_STRENGTH subtle), a 4-step ramp per light, two flat haze steps, dense attached dressing,
       glowing glyph strokes round the doorway (its neon signs, adapted), motes and bubbles taking the colour of a
       light they pass (its rain rule, adapted), a light bounce on the foreground's top edges.
     OUTPUT_MODE loop · LOOP_SECONDS 20 -> 1216 frames (20.27 s, a multiple of 32)* · EXPORT png-1x -> in loop mode a
       frame grab: "Pixel PNG 1x" (and P), plus the HD finish's PNG + one-loop WebM* · FINISH hd · OUTPUT_RES 1080 (x6)
     SEED 1 · RESOLUTION 320x180 · FRAME full · WORLD_W 2 (12 m of lateral camera travel)* · WORLD_H 1
     DETAIL rich · DITHER strong · PROJECTION depth · HORIZON 0.55 -> y 98.5 · CAMERA_HEIGHT auto -> raised (3 m, F 200)*
     TRAVEL left-to-right (the camera trucks right) · ENVIRONMENT underwater · ERA contemporary (an ancient ruin)
     SETTING an underwater temple with morning sun rays coming from above, glistening in the water and illuminating the
       temple, surrounded by beautiful coloured corals and marine life and fish
     SEASON autumn -> no effect underwater beyond a slightly denser marine snow* · DENSITY balanced
     SET_PIECES auto -> the temple (3-tier plinth, 6-step stair, 6-column portico, cella with a glowing doorway,
       pediment with a sun relief; its right corner has collapsed), 2 guardian statues, 3 column pairs along the
       processional way, a coral bommie (the reveal's occluder) with a moray and clownfish, a giant clam, a fallen
       column, the silhouettes of a sunken city in the haze*
     TARGETS auto -> none* · GROUND auto -> rippled sand and a paved way of large irregular slabs drifted with sand*
     TIME dawn · WEATHER clear (n/a underwater) · ATMOSPHERE light (golden-jade) · SKY none (the water column brightens
       toward a shimmering surface)
     LIGHT_STYLE top-lit · KEY sun, centre-high, not visible (dawn light bent down by the surface, still gold)*
     PRACTICALS 2 jellyfish (purple), the temple's entrance (light blue) + its glyphs · SHAFTS subtle
     SHADOWS contact-only · RIM auto -> gold on top edges; the colour of a practical on the side facing it*
     VIGNETTE medium · FLICKER candle (doorway + glyphs; the jellies pulse with their bells)* · PRACTICAL_STRENGTH subtle
     MOOD beautiful, calm, wonderful, exotic, magical · GRADE warm-mono -> gold key, warm dark-teal shadows (never navy);
       only corals, fish and the two practicals break the monochrome* · KEY_COLOUR #f7d275* · SHADOW_COLOUR #183c38*
     PALETTE 48 · SATURATION medium (water + stone lean muted, corals + lights saturated)* · BG_CONTRAST low
     LAYERS auto: water column (screen) · far layers z 110 / 70 / 48 · ground plane (baked strips, offset per row)
       · depth-sorted sprites (temple z 29.5-38, avenue, reef, bommie z 7) · foreground band (z 4.5)*
     FOREGROUND both (near-black coral band along the bottom; kelp trailing into both top corners)
     FOCUS foreground-soft (HD blurs the band and the corner kelp; wins over D10's far depth of field)*
     SUBJECT_COUNT 0 -> S1 (scuba diver) and INTERACTION ignored; BEATS = camera beats
     LOOP_CLOSE exit-reenter -> ambient (D5); the school and the turtle leave frame or are hidden by the fade*
     HELD_BEATS on · EFFECT_1 bubbles, SOURCE auto -> set pieces: the clam (2 bursts), a crack in the stair (a trickle
       rising through the door light), the moray's hole, two sand vents* · MOTION rise · ON_LAND none*
     RAMP auto -> #fff8d8, #b4c792, #548a6e* · AMBIENT fish (a glinting school, reef fish, angelfish, clownfish),
       marine snow, jellyfish, corals, marine life (turtle, moray, clam, starfish, urchins) · STATE_CHANGES none
     SWAY strong · SHOTS reveal: hold 2.3 s -> truck right 11 s -> hold 6.5 s centred on the temple -> dithered fade
     CAMERA_PACE slow (temple <= 11 px/s; the nearest midground ~49 px/s by parallax) · FRAMING centred
     LEAD_ROOM on (n/a) · TRANSITIONS dithered-fade · LOOP_CAMERA return (under the fade: an eased return at slow pace
       would take longer than the loop)* · CAMERA_SMOOTHING smooth (sine-eased, zero velocity at both ends)
     TITLE_CARD none · DEBUG seek (#t=)
   ========================================================================== */
const TITLE = 'Underwater Temple';
const W = 320, H = 180, IMG_TOP = 0, IMG_BOT = 180;            // FRAME full
const LOOP_FRAMES = 1216;                                       // 20.27 s
const SEED = 1, OUTPUT_MODE = 'loop', STILL_T = 0, DEBUG_KEYS = false, EXPORT_SCALES = [];   // pixel PNG button is the scene's own

const PAL_HEX = [
  '#070b0b', '#13201e',                                         // 0-1   near-blacks: fade, foreground
  '#183c38', '#255246', '#366a58', '#548a6e', '#7ea77f', '#b4c792', '#ebe4b4', // 2-8 water: deep jade -> surface cream
  '#fff8d8', '#f7d275',                                         // 9-10  sun: highlight, gold (rim, lit tops)
  '#ecdca4', '#c7b881', '#979571', '#677260',                   // 11-14 sand: lit -> deep shade
  '#f0dcc0', '#c9b196', '#8e8a78', '#52605a',                   // 15-18 temple stone: lit -> deep shade
  '#8b916b', '#5d6d56', '#3a4b41',                              // 19-21 rock (algae-tinted)
  '#c4ba5c', '#88913f', '#526238',                              // 22-24 kelp + algae
  '#ffae8c', '#ea6e6e', '#a3475f',                              // 25-27 coral pink
  '#e188c8', '#9a4b8a',                                         // 28-29 sea-fan magenta
  '#f79a4c', '#b25c34',                                         // 30-31 orange (sponges, clownfish)
  '#74cbab', '#3b8f7d',                                         // 32-33 teal coral
  '#fad4c6',                                                    // 34    pale pink (tentacle tips, polyps)
  '#f8e6ff', '#cb97f4', '#8d65c8', '#4f427c',                   // 35-38 jelly purple: core, bright, mid, dark tint
  '#eafeff', '#96e9f7', '#50b4d3', '#2c708f',                   // 39-42 door light blue: core, bright, mid, dark tint
  '#ad8e55', '#6e5c3b',                                         // 43-44 turtle shell
  '#7384d8', '#414f93',                                         // 45-46 blue tang, blue polyps
  '#fbe46a'                                                     // 47    lemon yellow (tang, tube sponges)
];
const K0 = 0, K1 = 1, WA0 = 2, WA1 = 3, WA2 = 4, WA3 = 5, WA4 = 6, WA5 = 7, WA6 = 8, SUN0 = 9, SUN1 = 10,
      SD0 = 11, SD1 = 12, SD2 = 13, SD3 = 14, ST0 = 15, ST1 = 16, ST2 = 17, ST3 = 18, RK0 = 19, RK1 = 20, RK2 = 21,
      KP0 = 22, KP1 = 23, KP2 = 24, CR0 = 25, CR1 = 26, CR2 = 27, MG0 = 28, MG1 = 29, OR0 = 30, OR1 = 31,
      TL0 = 32, TL1 = 33, PK0 = 34, JP0 = 35, JP1 = 36, JP2 = 37, JP3 = 38, LB0 = 39, LB1 = 40, LB2 = 41, LB3 = 42,
      TU0 = 43, TU1 = 44, BL0 = 45, BL1 = 46, YL0 = 47;

// ==========================================================================
// CORE A - shared engine: palette tables, framebuffer, primitives, PRNG
// (expects W, H, IMG_TOP, IMG_BOT, PAL_HEX, LOOP_FRAMES, SEED from the scene)
// ==========================================================================
const NP = PAL_HEX.length, CLEAR = 255, STEP = 1 / 60, TAU = Math.PI * 2, LOOP = LOOP_FRAMES / 60;
const PAL32 = new Uint32Array(NP);
for (let i = 0; i < NP; i++) {
  const v = parseInt(PAL_HEX[i].slice(1), 16);
  PAL32[i] = (0xff000000 | ((v & 0xff) << 16) | (v & 0xff00) | ((v >> 16) & 0xff)) >>> 0;
}
// Palette remap table: identity except for the listed [from, to] pairs. 256 wide so CLEAR maps to itself.
function makeLUT(pairs) {
  const l = new Uint8Array(256);
  for (let i = 0; i < 256; i++) l[i] = i;
  for (let i = 0; i < pairs.length; i += 2) l[pairs[i]] = pairs[i + 1];
  return l;
}

// ---- framebuffer + draw target (any index buffer, with a translation) ----
const FB = new Uint8Array(W * H);
let TB = FB, TW = W, TY0 = IMG_TOP, TY1 = IMG_BOT, TOX = 0, TOY = 0;
function target(buf, w, h, ox, oy) {
  TB = buf; TW = w; TOX = ox || 0; TOY = oy || 0;
  if (buf === FB) { TY0 = IMG_TOP; TY1 = IMG_BOT; } else { TY0 = 0; TY1 = h; }
}
const BAYER = new Uint8Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5]);
function bay(x, y) { return BAYER[((y & 3) << 2) | (x & 3)]; }
function px(x, y, c) {
  x += TOX; y += TOY;
  if (x < 0 || x >= TW || y < TY0 || y >= TY1) return;
  TB[y * TW + x] = c;
}
function rect(x, y, w, h, c) {
  x += TOX; y += TOY;
  const x0 = x < 0 ? 0 : x, x1 = x + w > TW ? TW : x + w;
  const y0 = y < TY0 ? TY0 : y, y1 = y + h > TY1 ? TY1 : y + h;
  for (let yy = y0; yy < y1; yy++) { const o = yy * TW; for (let xx = x0; xx < x1; xx++) TB[o + xx] = c; }
}
function hline(x0, x1, y, c) { if (x1 < x0) { const t = x0; x0 = x1; x1 = t; } rect(x0, y, x1 - x0 + 1, 1, c); }
function vline(x, y0, y1, c) { if (y1 < y0) { const t = y0; y0 = y1; y1 = t; } rect(x, y0, 1, y1 - y0 + 1, c); }
function drect(x, y, w, h, a, b, lvl) {
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) px(xx, yy, lvl > bay(xx, yy) ? b : a);
}
function remapAt(x, y, lut) {
  x += TOX; y += TOY;
  if (x < 0 || x >= TW || y < TY0 || y >= TY1) return;
  const i = y * TW + x, v = TB[i];
  if (v !== CLEAR) TB[i] = lut[v];
}
function getAt(x, y) {
  x += TOX; y += TOY;
  if (x < 0 || x >= TW || y < TY0 || y >= TY1) return CLEAR;
  return TB[y * TW + x];
}
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) {
    px(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function edgeF(ax, ay, bx, by, x, y) { return (bx - ax) * (y - ay) - (by - ay) * (x - ax); }
// Convex quad fill (points in order, either winding), sampled at pixel centres.
function quad(ax, ay, bx, by, cx, cy, dx, dy, c) {
  const x0 = Math.floor(Math.min(ax, bx, cx, dx)), x1 = Math.ceil(Math.max(ax, bx, cx, dx));
  const y0 = Math.floor(Math.min(ay, by, cy, dy)), y1 = Math.ceil(Math.max(ay, by, cy, dy));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const X = x + 0.5, Y = y + 0.5;
    const e0 = edgeF(ax, ay, bx, by, X, Y), e1 = edgeF(bx, by, cx, cy, X, Y);
    const e2 = edgeF(cx, cy, dx, dy, X, Y), e3 = edgeF(dx, dy, ax, ay, X, Y);
    if ((e0 >= 0 && e1 >= 0 && e2 >= 0 && e3 >= 0) || (e0 <= 0 && e1 <= 0 && e2 <= 0 && e3 <= 0)) px(x, y, c);
  }
}
function ellipse(cx, cy, rx, ry, c) {
  const x0 = Math.floor(cx - rx), x1 = Math.ceil(cx + rx), y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const u = (x + 0.5 - cx) / rx, v = (y + 0.5 - cy) / ry;
    if (u * u + v * v <= 1) px(x, y, c);
  }
}
// Radial dithered remap (glows, pools, soft shadows): level falls from maxLvl at the centre to 0 at the edge.
function glow(cx, cy, rx, ry, lut, maxLvl) {
  const x0 = Math.floor(cx - rx), x1 = Math.ceil(cx + rx), y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const u = (x + 0.5 - cx) / rx, v = (y + 0.5 - cy) / ry, d = u * u + v * v;
    if (d < 1 && (1 - Math.sqrt(d)) * maxLvl > bay(x, y)) remapAt(x, y, lut);
  }
}

// ---- PRNG + math (no allocation) ----
let rs = (SEED * 0x9E3779B1) | 0;
function rnd() {
  rs = (rs + 0x6D2B79F5) | 0;
  let t = Math.imul(rs ^ (rs >>> 15), 1 | rs);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function ease(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
function easeSine(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return 0.5 - 0.5 * Math.cos(t * Math.PI); }
function ri(v) { return Math.round(v); }
function hash(n) { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
let frame = 0, gT = 0;
// sin with k whole cycles per loop (anything built from this loops seamlessly)
function cyc(k, ph) { return Math.sin(TAU * gT * k / LOOP + ph); }

// ---- camera helpers (CAMERA_SMOOTHING): critically damped spring + low-pass filter ----
// spring(): st[i] = position, st[i+1] = velocity; optional maxAcc (px/s^2, 0 = none) for very-smooth.
function spring(st, i, target, smoothTime, maxAcc) {
  const om = 2 / smoothTime, x = om * STEP, ex = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  const ch = st[i] - target, tmp = (st[i + 1] + om * ch) * STEP;
  let v = (st[i + 1] - om * tmp) * ex;
  if (maxAcc > 0) { const dv = v - st[i + 1], lim = maxAcc * STEP; if (dv > lim) v = st[i + 1] + lim; else if (dv < -lim) v = st[i + 1] - lim; }
  st[i] = maxAcc > 0 ? st[i] + v * STEP : target + (ch + tmp) * ex;
  st[i + 1] = v;
}
function lowpass(cur, target, tau) { return cur + (target - cur) * (1 - Math.exp(-STEP / tau)); }
// Pixel-stable follow for axis a (0 = x, 1 = y): camera = round(subject) + an integer offset that walks toward
// round(off) one pixel at a time, and only on frames where that step would not reverse the camera's recent motion.
// The subject never wobbles on screen and the background never steps back and forth.
const PF_OFF = new Int32Array(2), PF_CAM = new Int32Array(2), PF_DIR = new Int8Array(2), PF_IDLE = new Uint16Array(2), PF_ON = new Uint8Array(2);
function pixelFollow(a, subj, off, lo, hi) {
  const s = Math.round(subj), want = Math.round(off);
  if (!PF_ON[a]) { PF_ON[a] = 1; PF_OFF[a] = want; PF_CAM[a] = clamp(s + want, lo, hi); return PF_CAM[a]; }
  if (want !== PF_OFF[a]) {
    const d = want > PF_OFF[a] ? 1 : -1, step = clamp(s + PF_OFF[a] + d, lo, hi) - PF_CAM[a];
    if (step === 0 || PF_DIR[a] === 0 || (step > 0 ? 1 : -1) === PF_DIR[a]) PF_OFF[a] += d;
  }
  const cam = clamp(s + PF_OFF[a], lo, hi), st = cam - PF_CAM[a];
  if (st !== 0) { PF_DIR[a] = st > 0 ? 1 : -1; PF_IDLE[a] = 0; } else if (++PF_IDLE[a] > 30) PF_DIR[a] = 0;
  PF_CAM[a] = cam;
  return cam;
}

// ---- vignette + frame bars ----
const VIG = new Uint8Array(W * H);
function buildVignette(strength) {                  // 0 off, 1 subtle, 2 medium, 3 strong
  const cx = (W - 1) / 2, cy = (IMG_TOP + IMG_BOT - 1) / 2, hx = W / 2, hy = (IMG_BOT - IMG_TOP) / 2;
  for (let y = IMG_TOP; y < IMG_BOT; y++) for (let x = 0; x < W; x++) {
    const nx = (x - cx) / hx, ny = (y - cy) / hy, a = nx * nx, b = ny * ny;
    VIG[y * W + x] = strength ? clamp(ri((a * a + b * b * 0.7 + 0.6 * a * b - 0.55) * (6 + strength * 6)), 0, 15) : 0;
  }
}
function applyVignette(lut) {
  for (let y = IMG_TOP; y < IMG_BOT; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (VIG[i] > bay(x, y)) FB[i] = lut[FB[i]];
  }
}
function frameBars(c) { FB.fill(c, 0, IMG_TOP * W); FB.fill(c, IMG_BOT * W); }

// ---- lit sprite blit: rim on exposed edges, lit band, shaded interior, selective outline ----
const NORIM = new Uint8Array(256);                  // 1 = material keeps its own highlight (metal, glass)
let sBuf = FB, sW = 0, sH = 0, sFlip = false;
function sop(x, y) {
  if (x < 0 || y < 0 || x >= sW || y >= sH) return false;
  return sBuf[y * sW + (sFlip ? sW - 1 - x : x)] !== CLEAR;
}
// rimR/rimL/rimT: rim colour where the right/left/top neighbour is empty (CLEAR = no rim on that side).
// out/outSide: outline colour in empty pixels left (-1) / right (1) / all round (2) of the shape, 0 = none.
// lit: lit-band width behind a rim; deeper pixels take shade[] (null = no shading). light[]: metal highlight.
function blitLit(buf, w, h, ox, oy, flip, rimR, rimL, rimT, out, outSide, lit, shade, groundRows, light) {
  sBuf = buf; sW = w; sH = h; sFlip = flip;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = buf[y * w + (flip ? w - 1 - x : x)], X = ox + x, Y = oy + y;
    if (v === CLEAR) {
      if (out === CLEAR || outSide === 0) continue;
      let o;
      if (outSide === -1) o = sop(x + 1, y);
      else if (outSide === 1) o = sop(x - 1, y);
      else o = sop(x + 1, y) || sop(x - 1, y) || sop(x, y + 1) || sop(x, y - 1);
      if (o) px(X, Y, out);
      continue;
    }
    const ground = y >= h - groundRows;
    // a rim needs 2+ px of thickness behind it, so 1-px limbs and props don't turn into glowing sticks
    const eR = rimR !== CLEAR && !sop(x + 1, y) && sop(x - 1, y), eL = rimL !== CLEAR && !sop(x - 1, y) && sop(x + 1, y);
    const eT = rimT !== CLEAR && !sop(x, y - 1) && sop(x, y + 1);
    let c = v;
    if (!ground && (eR || eL || eT)) c = NORIM[v] ? light[v] : (eR ? rimR : eL ? rimL : rimT);
    else if (shade !== null) {
      let near = false;
      for (let d = 2; d <= lit + 1 && !near; d++)
        near = (rimR !== CLEAR && !sop(x + d, y)) || (rimL !== CLEAR && !sop(x - d, y)) || (rimT !== CLEAR && !sop(x, y - d));
      if (!near) c = shade[v];
    }
    px(X, Y, c);
  }
}

// ==========================================================================
// KIT: NEON-NOIR (LOOK = neon-noir) - the lighting recipe from "Neon Rain", shared by scenes in that look.
// Projection-neutral: it works on palette indices and screen-space buffers. The scene supplies its material
// ramps (dark -> lit), a per-pixel depth buffer for light pools and a wet mask for reflections.
// Include it after core_a (it uses makeLUT, bay, hash, FB, W, H, IMG_TOP, IMG_BOT, LOOP, gT, frame).
// ==========================================================================

// ---- colour tables built from ramps ----
// A practical's colour: each material keeps its value but takes the light's hue (dark -> d, mid -> m, lit -> b).
function kTint(ramps, d, m, b) {
  const pairs = [];
  for (let r = 0; r < ramps.length; r++) {
    const R = ramps[r], n = R.length;
    for (let k = 0; k < n; k++) { const f = n === 1 ? 0.5 : k / (n - 1); pairs.push(R[k], f < 0.34 ? d : f < 0.67 ? m : b); }
  }
  return makeLUT(pairs);
}
// One step along each ramp: dir +1 = LIGHT (brighter, top clamps to 'top'), -1 = SHADE (darker, bottom to 'bottom').
function kStep(ramps, dir, top, bottom) {
  const pairs = [];
  for (let r = 0; r < ramps.length; r++) {
    const R = ramps[r], n = R.length;
    for (let k = 0; k < n; k++) { const j = k + dir; pairs.push(R[k], j < 0 ? bottom : j >= n ? (top === undefined ? R[n - 1] : top) : R[j]); }
  }
  return makeLUT(pairs);
}
// Wet reflection: lights stay coloured one step down; every other material sinks one step, its darkest to 'floor'.
function kRefl(lightRamps, matRamps, floor) {
  const pairs = [];
  for (let r = 0; r < lightRamps.length; r++) { const R = lightRamps[r]; for (let k = 0; k < R.length; k++) pairs.push(R[k], R[Math.min(R.length - 1, k + 1)]); }
  for (let r = 0; r < matRamps.length; r++) { const R = matRamps[r]; for (let k = 0; k < R.length; k++) pairs.push(R[k], k === 0 ? floor : R[k - 1]); }
  return makeLUT(pairs);
}
// Toward the glowing haze: every ramp entry maps to the fog ramp entry nearest its brightness (dark -> fog[0]).
function kFogStep(ramps, fog) {
  const pairs = [];
  for (let r = 0; r < ramps.length; r++) { const R = ramps[r], n = R.length; for (let k = 0; k < n; k++) pairs.push(R[k], fog[Math.min(fog.length - 1, Math.floor(k / n * fog.length + 0.5))]); }

function hdName(ext) { return TITLE.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + (hdOn ? 'hd-' : 'pixel-') + hdRes + 'p.' + ext; }
function hdSave(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function hdPNG() { HDC.toBlob((b) => hdSave(b, hdName('png')), 'image/png'); }
function hdRecordLoop() {
  if (hdRecState || typeof MediaRecorder === 'undefined') return;
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  let mt = ''; for (let k = 0; k < types.length; k++) if (MediaRecorder.isTypeSupported(types[k])) { mt = types[k]; break; }
  hdRec = new MediaRecorder(HDC.captureStream(60), { mimeType: mt, videoBitsPerSecond: hdRes === 2160 ? 80e6 : 30e6 });
  hdRecChunks = []; hdRec.ondataavailable = (e) => { if (e.data.size) hdRecChunks.push(e.data); };
  hdRec.onstop = () => { hdSave(new Blob(hdRecChunks, { type: 'video/webm' }), hdName('webm')); hdRecState = 0; hdUpdateUI(); };
  hdRecState = 1; hdUpdateUI();                                     // armed: recording starts when the loop wraps to frame 0
}
let hdPrevFrame = 0;
function hdRecTick() {
  if (hdRecState === 1 && frame < hdPrevFrame) { hdRec.start(250); hdRecState = 2; }
  else if (hdRecState === 2 && frame < hdPrevFrame) { hdRec.stop(); hdRecState = 3; }
  if (hdRecState === 2 && hdUI) hdUI.rec.textContent = 'Recording ' + (frame / 60).toFixed(1) + ' / ' + (LOOP_FRAMES / 60).toFixed(1) + ' s';
  hdPrevFrame = frame;
}
function hdAddUI() {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;right:10px;bottom:10px;display:flex;gap:6px;opacity:.4;transition:opacity .2s;font:12px/1 system-ui,sans-serif;z-index:2';
  bar.onmouseenter = () => { bar.style.opacity = 1; }; bar.onmouseleave = () => { bar.style.opacity = 0.4; };
  const mk = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; b.style.cssText = 'background:#1b1a24;color:#e8e4f0;border:1px solid #3a3850;padding:6px 10px;cursor:pointer'; bar.appendChild(b); return b; };
  hdUI = {
    fin: mk('', () => { hdOn = !hdOn; hdUpdateUI(); }),
    res: mk('', () => { hdRes = hdRes === 1080 ? 2160 : 1080; hdResize(); hdUpdateUI(); }),
    png: mk('PNG', hdPNG),
    rec: mk('', hdRecordLoop)
  };
  document.body.appendChild(bar); hdUpdateUI();
}
function hdUpdateUI() {
  if (!hdUI) return;
  hdUI.fin.textContent = hdOn ? 'Finish: HD (H)' : 'Finish: pixel (H)';
  hdUI.res.textContent = hdRes === 1080 ? '1080p (R)' : '4K (R)';
  hdUI.rec.textContent = hdRecState === 1 ? 'Waiting for loop start…' : hdRecState >= 2 ? 'Recording…' : 'Record loop (WebM)';
}

// ==========================================================================
// CORE B - shared engine: output, fixed-step loop, debug keys, PNG export
// (expects bake(), update(), render() from the scene)
// ==========================================================================
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');
const img = octx.createImageData(W, H), out32 = new Uint32Array(img.data.buffer);
const HDM = typeof hdInit === 'function' ? hdInit() : false;          // optional HD finish (core/hd.js) takes over the output
let scale = 1, offX = 0, offY = 0;
function resize() {
  if (HDM) { hdResize(); return; }
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.floor(innerWidth * dpr)), chh = Math.max(1, Math.floor(innerHeight * dpr));
  canvas.width = cw; canvas.height = chh;
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  scale = Math.max(1, Math.floor(Math.min(cw / W, chh / H)));
  offX = Math.floor((cw - W * scale) / 2); offY = Math.floor((chh - H * scale) / 2);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, chh);
}
function present() {
  for (let i = 0; i < W * H; i++) out32[i] = PAL32[FB[i]];
  octx.putImageData(img, 0, 0);
  if (HDM) { hdPresent(); return; }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, W, H, offX, offY, W * scale, H * scale);
}
function simStep() { frame = (frame + 1) % LOOP_FRAMES; gT = frame / 60; update(); }

function savePNG(mult) {
  const c = document.createElement('canvas'); c.width = W * mult; c.height = H * mult;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(off, 0, 0, W, H, 0, 0, W * mult, H * mult);
  c.toBlob((b) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = TITLE.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + mult + 'x.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}
function addExport() {
  const bar = document.createElement('div'); bar.id = 'export';
  for (let k = 0; k < EXPORT_SCALES.length; k++) {
    const m = EXPORT_SCALES[k], b = document.createElement('button');
    b.textContent = 'PNG ' + m + '×'; b.onclick = () => savePNG(m);
    bar.appendChild(b);
  }
  document.body.appendChild(bar);
}

// ---- boot: bake static layers, pre-roll one loop, optional seek ----
bake();
for (let i = 0; i < LOOP_FRAMES; i++) simStep();                 // stateful systems reach steady state
let startF = OUTPUT_MODE === 'still' ? ri(STILL_T * 60) % LOOP_FRAMES : 0;
const seekM = /t=(\d+(?:\.\d+)?)/.exec(location.hash);
if (seekM) startF = Math.floor(parseFloat(seekM[1]) * 60) % LOOP_FRAMES;
for (let i = 0; i < startF; i++) simStep();
resize();
window.addEventListener('resize', () => { resize(); present(); });

if (OUTPUT_MODE === 'still') {
  render(); present();
  if (EXPORT_SCALES.length) addExport();
} else {
  let last = performance.now(), acc = 0, paused = false;
  const tick = (now) => {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.25) dt = 0.25; else if (dt < 0) dt = 0;
    if (!paused) { acc += dt; while (acc >= STEP) { simStep(); acc -= STEP; } }
    render(); present();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  if (DEBUG_KEYS) window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
    else if (paused && e.code === 'ArrowRight') simStep();
    else if (paused && e.code === 'ArrowLeft') for (let i = 0; i < LOOP_FRAMES - 1; i++) simStep();
  });
  if (EXPORT_SCALES.length) addExport();
}
})();
</script>
</body>
</html>
